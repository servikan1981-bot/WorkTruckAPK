name: Rebuild verified OurFamily 6.0.48 joystick
on:
  push:
    branches: [release/family-6.0.48-secure-publish]
    paths: [.github/workflows/build-family-648-joystick-v2.yml]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.48-secure-publish
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          test -s duoapp/src/main/assets/arkanoid_joystick.js
          grep -q 'versionCode 6048' duoapp/build.gradle
          grep -q "versionName '6.0.48'" duoapp/build.gradle
          grep -q "APP_VERSION='6.0.48'" duoapp/src/main/assets/index.html
          grep -q '<script src="arkanoid_joystick.js"></script>' duoapp/src/main/assets/index.html
          grep -q '__ourFamilyArkanoidJoystickV2=true' duoapp/src/main/assets/arkanoid_joystick.js
          grep -q 'if(hint&&hint.textContent!==text)' duoapp/src/main/assets/arkanoid_joystick.js
          grep -q 'arkanoid-fullscreen-mode .ark-joy-dock' duoapp/src/main/assets/arkanoid_joystick.js
          node --check duoapp/src/main/assets/arkanoid_joystick.js
          node --check duoapp/src/main/assets/arkanoid.js
      - name: Build release APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Verify final joystick inside APK
        shell: bash
        run: |
          set -euo pipefail
          A=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          unzip -l "$A" | grep -q 'assets/arkanoid_joystick.js'
          unzip -p "$A" assets/index.html | grep -q '<script src="arkanoid_joystick.js"></script>'
          unzip -p "$A" assets/index.html | grep -q "APP_VERSION='6.0.48'"
          unzip -p "$A" assets/arkanoid_joystick.js | grep -q '__ourFamilyArkanoidJoystickV2=true'
          unzip -p "$A" assets/arkanoid_joystick.js | grep -q 'if(hint&&hint.textContent!==text)'
          unzip -p "$A" assets/arkanoid_joystick.js | grep -q 'arkanoid-fullscreen-mode .ark-joy-dock'
          echo FINAL_JOYSTICK_V2_IS_INSIDE_APK
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_48_unsigned_v2
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
