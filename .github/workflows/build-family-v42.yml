name: Build Our Family v4.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ family-v4-2-fast-video ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-v42.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>', h, flags=re.S)
          assert blocks, 'script block missing'
          Path('/tmp/ourfamily.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/ourfamily.js
      - name: Protocol safety checks
        run: |
          grep -q "call_candidate" duoapp/src/main/assets/index.html
          grep -q "flushRemoteCandidates" duoapp/src/main/assets/index.html
          grep -q "armConnectionWatchdog" duoapp/src/main/assets/index.html
          grep -q "call_notified_" duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          python3 - <<'PY'
          from pathlib import Path
          s=Path('duoapp/src/main/java/com/sergey/duochat/MessagingService.java').read_text()
          block=s[s.index('if ("call_invite"'):s.index('} else if ("chat"')]
          assert '"call_offer".equals(kind)' not in block, 'call_offer still triggers incoming call UI'
          PY
      - name: Build APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug
      - name: Verify APK
        run: |
          APK=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "call_candidate"
          unzip -p "$APK" assets/index.html | grep -q "Сергей — админ, имеет доступ ко всему приложению."
          ls -lh "$APK"
      - name: Rename APK
        run: cp duoapp/build/outputs/apk/debug/duoapp-debug.apk OurFamily_v4_2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_v4_2
          path: OurFamily_v4_2.apk
          if-no-files-found: error
