name: Prepare OurFamily 6.0.37 media cache

on:
  push:
    branches: ['fix/family-6.0.37-media-cache']
    paths:
      - '.github/workflows/prepare-family-637-media-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.37-media-cache
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Apply media cache patch
        run: |
          python3 tools/fix_patch_family_637_scope.py
          python3 tools/patch_family_637_media.py
      - name: Validate media cache patch
        run: |
          set -euo pipefail
          grep -q 'versionCode 6037' duoapp/build.gradle
          grep -q "versionName '6.0.37'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.37"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.37'" duoapp/src/main/assets/index.html
          grep -q 'attachmentDownloadPending' duoapp/src/main/assets/index.html
          grep -q 'getAttachmentObjectUrl' duoapp/src/main/assets/index.html
          grep -q 'keptAttachments' duoapp/src/main/assets/index.html
          grep -q "video.preload='auto'" duoapp/src/main/assets/index.html
          grep -q 'rememberMediaState' duoapp/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          assert h.count('function getAttachmentObjectUrl(')==1
          assert h.count('function renderAttachmentInto(')==1
          assert h.count('function renderMessages(){')==1
          assert "card.dataset.attachmentKey=key" in h
          assert "b.appendChild(kept)" in h
          assert "if(attachmentDownloadPending[att.id])return attachmentDownloadPending[att.id]" in h
          Path('/tmp/family637.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/family637.js
          node tools/test_ludo.cjs
      - name: Build unsigned 6.0.37 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Verify unsigned identity
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          "$AAPT" dump badging "$APK" > /tmp/badging637.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging637.txt
          grep -q "versionCode='6037'" /tmp/badging637.txt
          grep -q "versionName='6.0.37'" /tmp/badging637.txt
      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html tools/patch_family_637_media.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix repeated chat media loading for 6.0.37'
            git push origin HEAD:fix/family-6.0.37-media-cache
          fi
