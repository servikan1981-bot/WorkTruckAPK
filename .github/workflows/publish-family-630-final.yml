name: Publish OurFamily 6.0.30 final

on:
  push:
    branches: [family-stable-6]
    paths:
      - '.github/workflows/publish-family-630-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-stable-6
          fetch-depth: 1

      - name: Recover structurally valid staged 6.0.30 candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, re, zipfile, json

          parts=[]
          for i in range(10):
              p=Path(f'updates/parts/v630_{i:02d}.b64')
              assert p.is_file()
              parts.append(re.sub(r'\s+','',p.read_text(encoding='ascii')))
          print('chunk lengths:', [len(x) for x in parts])
          raw=''.join(parts)
          assert len(raw)%4==1, f'unexpected staged length {len(raw)} mod4={len(raw)%4}'

          # Part 04 is the only oversized regular chunk. Scan deletion positions there.
          offset=sum(len(x) for x in parts[:4])
          source=parts[4]
          found=[]
          for pos in range(len(source)):
              candidate = raw[:offset+pos] + raw[offset+pos+1:]
              try:
                  apk=base64.b64decode(candidate,validate=True)
              except Exception:
                  continue
              if apk[:4] != b'PK\x03\x04':
                  continue
              try:
                  with zipfile.ZipFile(io.BytesIO(apk)) as z:
                      names=set(z.namelist())
                      if 'AndroidManifest.xml' not in names or 'classes.dex' not in names:
                          continue
                      if z.testzip() is not None:
                          continue
              except Exception:
                  continue
              out=Path(f'/tmp/recovered630_{len(found):03d}.apk')
              out.write_bytes(apk)
              sha=hashlib.sha256(apk).hexdigest()
              print('CRC-valid candidate:', pos, len(apk), sha, out)
              found.append({'pos':pos,'path':str(out),'sha256':sha})
              if len(found)>=100:
                  break
          Path('/tmp/recovered630.json').write_text(json.dumps(found),encoding='utf-8')
          assert found, 'No CRC-valid APK found by repairing staged part 04'
          print('CRC-valid candidates:',len(found))
          PY

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Select candidate with exact package/version and same signing certificate as 6.0.29
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OLD=updates/downloads/OurFamily_6_0_29_Stable.apk
          test -s "$OLD"
          "$BT/apksigner" verify --verbose --print-certs "$OLD" > /tmp/old-sign.txt
          OLD_CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/old-sign.txt | sed 's/.*: //')
          test -n "$OLD_CERT"
          echo "stable certificate: $OLD_CERT"
          SELECTED=''
          for APK in /tmp/recovered630_*.apk; do
            "$BT/aapt" dump badging "$APK" > /tmp/badging.txt 2>/dev/null || continue
            grep -q "package: name='com.sergey.ourfamily'" /tmp/badging.txt || continue
            grep -q "versionCode='6030'" /tmp/badging.txt || continue
            grep -q "versionName='6.0.30'" /tmp/badging.txt || continue
            "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/new-sign.txt 2>/dev/null || continue
            NEW_CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/new-sign.txt | sed 's/.*: //')
            [ "$NEW_CERT" = "$OLD_CERT" ] || continue
            SELECTED="$APK"
            break
          done
          test -n "$SELECTED"
          cp "$SELECTED" /tmp/OurFamily_6_0_30_Stable.apk
          echo "selected: $SELECTED"
          sha256sum /tmp/OurFamily_6_0_30_Stable.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_30_Stable.apk

      - name: Normalize chunks and release manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_30_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          m=json.loads(Path('updates/candidates/630.json').read_text(encoding='utf-8'))
          m['versionCode']=6030
          m['versionName']='6.0.30'
          m['sha256']=sha
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          for p in Path('updates/parts').glob('v630_*.b64'):
              p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              assert i==len(chunks)-1 or len(c)%4==0
              name=f'v630_{i:02d}.b64'
              Path('updates/parts',name).write_text(c,encoding='ascii')
              urls.append(base+name)
          m['apkBase64Parts']=urls
          text=json.dumps(m,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates/630.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          reconstructed=base64.b64decode(''.join(Path('updates/parts',u.rsplit('/',1)[-1]).read_text() for u in urls))
          assert reconstructed==apk
          assert hashlib.sha256(reconstructed).hexdigest()==sha
          print('normalized chunks:',len(chunks),[len(c) for c in chunks])
          print('release sha256:',sha)
          PY

      - name: Publish 6.0.30 atomically
        run: |
          set -euo pipefail
          cp /tmp/OurFamily_6_0_30_Stable.apk updates/downloads/OurFamily_6_0_30_Stable.apk
          git config user.name 'ourfamily-release-bot'
          git config user.email 'ourfamily-release-bot@users.noreply.github.com'
          git add -A updates/parts/v630_*.b64 updates/candidates/630.json updates/latest.json updates/downloads/OurFamily_6_0_30_Stable.apk
          git commit -m 'Release OurFamily 6.0.30 stable'
          git push origin HEAD:family-stable-6

      - name: Final check
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          assert m['versionCode']==6030 and m['versionName']=='6.0.30'
          assert len(m['sha256'])==64
          print('latest.json -> 6.0.30 OK',m['sha256'])
          PY
