name: Build OurFamily 6.0.30 game and call fix

on:
  push:
    branches: [ family-630-game-fix ]
    paths:
      - 'duoapp/**'
      - 'tools/patch_family_630.py'
      - 'tools/patch_family_630_call.py'
      - 'tools/test_checkers.cjs'
      - 'tools/test_durak.cjs'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-630.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply 6.0.30 fixes
        run: |
          python3 tools/patch_family_630.py
          python3 tools/patch_family_630_call.py

      - name: Validate game and fast-call transport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'gradle': Path('duoapp/build.gradle').read_text(),
              'manifest': Path('duoapp/src/main/AndroidManifest.xml').read_text(),
              'outbox': Path('duoapp/src/main/java/com/sergey/duochat/ReliableRelayOutbox.java').read_text(),
              'inbox': Path('duoapp/src/main/java/com/sergey/duochat/RelayInbox.java').read_text(),
              'service': Path('duoapp/src/main/java/com/sergey/duochat/MessagingService.java').read_text(),
              'main': Path('duoapp/src/main/java/com/sergey/duochat/MainActivity.java').read_text(),
              'transport': Path('duoapp/src/main/java/com/sergey/duochat/NativeRelayTransport.java').read_text(),
              'html': Path('duoapp/src/main/assets/index.html').read_text(),
          }
          checks = [
              ('versionCode 6030', 'versionCode 6030' in files['gradle']),
              ('versionName 6.0.30', "versionName '6.0.30'" in files['gradle']),
              ('manifest label 6.0.30', 'android:label="Наша семья 6.0.30"' in files['manifest']),
              ('single ordered game outbox worker', 'newSingleThreadExecutor' in files['outbox'] and 'newFixedThreadPool(4' not in files['outbox']),
              ('ordered game worker name', 'OurFamilyReliableSendOrdered' in files['outbox']),
              ('stop drain after failed game head send', 'if (!sent) return;' in files['outbox']),
              ('fast game retry 1200 ms', '1200, TimeUnit.MILLISECONDS' in files['outbox']),
              ('native inbox wakes visible UI', 'MainActivity.notifyRelayArrived();' in files['inbox']),
              ('fresh game notification channel', 'family_games_v630' in files['service']),
              ('game notification lockscreen visible', 'setLockscreenVisibility(Notification.VISIBILITY_PUBLIC)' in files['service']),
              ('dedicated SDP executor', 'OurFamilySdpSignal' in files['main'] and 'SDP_POSTER.execute' in files['main']),
              ('batch SDP no longer uses call-control queue', 'CALL_POSTER.execute(() -> reportRelayResult(requestId,\n                        NativeRelayTransport.postBatchJson' not in files['main']),
              ('fast high-priority connect timeout', 'priority >= 4 ? 4500 : 10000' in files['transport']),
              ('fast high-priority read timeout', 'priority >= 4 ? 5000 : 12000' in files['transport']),
              ('TLS failures retried', 'result.startsWith("ERR:SSL")' in files['transport']),
              ('HTTPS response drained for keep-alive', 'drainResponse(c, status);' in files['transport'] and 'drainResponse(c, code);' in files['transport']),
              ('call relay JS timeout bounded', 'var timeoutMs=(priority||0)>=4?18000:48000;' in files['html']),
              ('TURN wait bounded to 2.5 sec', files['html'].count('waitForRelaySdp(ps.pc,2500)') == 2 and 'waitForRelaySdp(ps.pc,10000)' not in files['html']),
              ('invite and offer no longer serialized', 'sendInvite();\n   setTimeout(sendInvite,700);' in files['html'] and 'await sendInvite();\n   await mediaPromise;' not in files['html']),
              ('accept no longer blocks media on relay POST', "publishEnvelope(inv.from,'direct_accept',{callId:inv.id},5,'direct_accept',inv.id).catch(function(){});" in files['html']),
              ('web APP_VERSION 6.0.30', "APP_VERSION='6.0.30'" in files['html']),
              ('350 ms fallback inbox poll', 'setInterval(pollInbox,350)' in files['html']),
          ]
          failed=[]
          for name, ok in checks:
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
              if not ok: failed.append(name)
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY

      - name: Validate JavaScript and game rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>', h, flags=re.S)
          assert blocks
          Path('/tmp/family630.js').write_text('\n'.join(blocks))
          assert '6.0.30' in h
          assert 'Дурак' in h
          assert 'Шашки' in h
          PY
          node --check /tmp/family630.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs

      - name: Build 6.0.30 candidate
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify candidate package
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.sergey.ourfamily' versionCode='6030' versionName='6.0.30'"
          unzip -p "$APK" assets/index.html | grep -q '6.0.30'
          unzip -p "$APK" assets/index.html | grep -q 'setInterval(pollInbox,350)'
          unzip -p "$APK" assets/index.html | grep -q 'waitForRelaySdp(ps.pc,2500)'
          sha256sum "$APK" | tee /tmp/family630.sha256
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_30_Game_CallFix_unsigned
          path: |
            duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
            /tmp/family630.sha256
          if-no-files-found: error
