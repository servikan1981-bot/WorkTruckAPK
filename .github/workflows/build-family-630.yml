name: Build OurFamily 6.0.30 game fix

on:
  push:
    branches: [ family-630-game-fix ]
    paths:
      - 'duoapp/**'
      - 'tools/patch_family_630.py'
      - 'tools/test_checkers.cjs'
      - 'tools/test_durak.cjs'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-630.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply 6.0.30 game delivery patch
        run: python3 tools/patch_family_630.py

      - name: Validate ordered game transport and notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'gradle': Path('duoapp/build.gradle').read_text(),
              'manifest': Path('duoapp/src/main/AndroidManifest.xml').read_text(),
              'outbox': Path('duoapp/src/main/java/com/sergey/duochat/ReliableRelayOutbox.java').read_text(),
              'inbox': Path('duoapp/src/main/java/com/sergey/duochat/RelayInbox.java').read_text(),
              'service': Path('duoapp/src/main/java/com/sergey/duochat/MessagingService.java').read_text(),
              'html': Path('duoapp/src/main/assets/index.html').read_text(),
          }
          checks = [
              ('versionCode 6030', 'versionCode 6030' in files['gradle']),
              ('versionName 6.0.30', "versionName '6.0.30'" in files['gradle']),
              ('manifest label 6.0.30', 'android:label="Наша семья 6.0.30"' in files['manifest']),
              ('single ordered outbox worker', 'newSingleThreadExecutor' in files['outbox'] and 'newFixedThreadPool(4' not in files['outbox']),
              ('ordered worker name', 'OurFamilyReliableSendOrdered' in files['outbox']),
              ('stop drain after failed head send', 'if (!sent) return;' in files['outbox']),
              ('fast retry 1200 ms', '1200, TimeUnit.MILLISECONDS' in files['outbox']),
              ('native inbox wakes visible UI', 'MainActivity.notifyRelayArrived();' in files['inbox']),
              ('fresh game notification channel id', 'family_games_v630' in files['service']),
              ('game channel user label', 'Игры — приглашения и ходы' in files['service']),
              ('game notification uses CH_GAMES', 'new Notification.Builder(this, CH_GAMES)' in files['service']),
              ('game notification visible on lock screen', 'setLockscreenVisibility(Notification.VISIBILITY_PUBLIC)' in files['service']),
              ('web APP_VERSION 6.0.30', "APP_VERSION='6.0.30'" in files['html']),
              ('350 ms fallback poll', 'setInterval(pollInbox,350)' in files['html']),
          ]
          failed=[]
          for name, ok in checks:
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
              if not ok: failed.append(name)
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY

      - name: Validate JavaScript and game rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>', h, flags=re.S)
          assert blocks
          Path('/tmp/family630.js').write_text('\n'.join(blocks))
          assert '6.0.30' in h
          assert 'Дурак' in h
          assert 'Шашки' in h
          PY
          node --check /tmp/family630.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs

      - name: Build 6.0.30 candidate
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify candidate package
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.sergey.ourfamily' versionCode='6030' versionName='6.0.30'"
          unzip -p "$APK" assets/index.html | grep -q '6.0.30'
          unzip -p "$APK" assets/index.html | grep -q 'setInterval(pollInbox,350)'
          sha256sum "$APK" | tee /tmp/family630.sha256
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_30_GameFix_unsigned
          path: |
            duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
            /tmp/family630.sha256
          if-no-files-found: error
