name: Assemble encrypted signing payload 6.0.47
on:
  push:
    branches: [release/family-6.0.47-secure-publish]
    paths: [.github/workflows/assemble-signing-647.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.47-secure-publish
          fetch-depth: 0
      - name: Assemble encrypted payload
        run: |
          set -euo pipefail
          cat updates/candidates/signed647/encrypted_payload.part0 updates/candidates/signed647/encrypted_payload.part1 updates/candidates/signed647/encrypted_payload.part2 updates/candidates/signed647/encrypted_payload.part3 > updates/candidates/signed647/encrypted_payload.b64
          test "$(wc -c < updates/candidates/signed647/encrypted_payload.b64)" -gt 6000
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed647/encrypted_payload.b64
          git commit -m 'Assemble encrypted 6.0.47 signing payload'
          git push origin HEAD:release/family-6.0.47-secure-publish
