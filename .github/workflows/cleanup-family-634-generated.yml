name: Clean generated files from OurFamily 6.0.34

on:
  push:
    branches: ['fix/family-6.0.34-ludo-launch']
    paths:
      - '.github/workflows/cleanup-family-634-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.34-ludo-launch
          fetch-depth: 0
      - name: Restore generated build tree from stable
        run: |
          set -euo pipefail
          git fetch origin family-stable-6
          git checkout origin/family-stable-6 -- duoapp/build || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A duoapp/build
          if ! git diff --cached --quiet; then
            git commit -m 'Restore generated Android build files before 6.0.34 merge'
            git push origin HEAD:fix/family-6.0.34-ludo-launch
          fi
