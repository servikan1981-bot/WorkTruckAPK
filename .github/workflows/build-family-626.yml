name: Build OurFamily 6.0.26 video transport
on:
  push:
    branches: [family-626-video]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: |
          node tools/test_family_624_async.cjs
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('duoapp/src/main/assets/index.html').read_text()
          Path('/tmp/family626.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S)))
          PY
          node --check /tmp/family626.js
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk | grep -q "versionCode='6026' versionName='6.0.26'"
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_26_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error
  turn-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - working-directory: family-turn-windows
        run: |
          go mod tidy
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o family-turn.exe .
          file family-turn.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_TURN_Windows
          path: |
            family-turn-windows/family-turn.exe
            family-turn-windows/start-turn.cmd
            family-turn-windows/start-turn.ps1
            family-turn-windows/README-RU.txt
          if-no-files-found: error
