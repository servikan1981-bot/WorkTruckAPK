name: Prepare OurFamily 6.0.20 Games

on:
  workflow_dispatch:
  push:
    branches: [ family-620-games ]
    paths:
      - 'tools/patch_family_620.py'
      - 'tools/patch_family_620_fix.py'
      - 'tools/test_durak.cjs'
      - 'duoapp/src/main/assets/durak.js'
      - '.github/workflows/prepare-family-620.yml'
      - 'FAMILY_620_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-620-games
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply 6.0.20 patch when needed
        run: |
          if grep -q "APP_VERSION='6.0.19'" duoapp/src/main/assets/index.html; then
            python3 tools/patch_family_620.py
            python3 tools/patch_family_620_fix.py
          else
            grep -q "APP_VERSION='6.0.20'" duoapp/src/main/assets/index.html
            echo 'Source is already prepared as 6.0.20'
          fi

      - name: Test game rules and JavaScript
        run: |
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          Path('/tmp/family620.js').write_text('\n'.join(blocks))
          required=['APP_VERSION=\'6.0.20\'','id="games"','id="durak"','DurakRules','Новичок','Опытный','Мастер','Крутяга','Профи','Пригласить в игру','navGames']
          for token in required: assert token in h, token
          assert "fetch(" not in h
          assert "acceptGame(pendingGameAcceptId)" in h
          PY
          node --check /tmp/family620.js

      - name: Validate version and native notifications
        run: |
          grep -q "versionCode 6020" duoapp/build.gradle
          grep -q "versionName '6.0.20'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.20"' duoapp/src/main/AndroidManifest.xml
          grep -q 'Приглашает в игру' duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          if grep -q 'Приглашает играть в шашки' duoapp/src/main/java/com/sergey/duochat/MessagingService.java; then exit 1; fi

      - name: Build APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug :duoapp:assembleRelease

      - name: Verify APK content
        run: |
          D=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          R=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$D"
          test -s "$R"
          unzip -t "$D" >/dev/null
          unzip -t "$R" >/dev/null
          unzip -p "$R" assets/index.html | grep -q "Наша семья · v6.0.20"
          unzip -p "$R" assets/index.html | grep -q 'id="durak"'
          unzip -p "$R" assets/durak.js | grep -q 'DurakRules'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$D"

      - name: Package signing utilities
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/signing-tools/lib
          cp "$BT/apksigner" /tmp/signing-tools/
          cp "$BT/zipalign" /tmp/signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/signing-tools/lib/
          if [ -d "$BT/lib64" ]; then cp -a "$BT/lib64" /tmp/signing-tools/; fi
          chmod +x /tmp/signing-tools/apksigner /tmp/signing-tools/zipalign

      - name: Commit prepared source
        run: |
          git config user.name 'servikan1981-bot'
          git config user.email 'servikan1981@gmail.com'
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare OurFamily 6.0.20 games UI and rating'
            git push origin HEAD:family-620-games
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_20_games_debug
          path: duoapp/build/outputs/apk/debug/duoapp-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_20_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-620
          path: /tmp/signing-tools
          if-no-files-found: error
