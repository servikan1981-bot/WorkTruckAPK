name: Secure publish OurFamily 6.0.47

on:
  push:
    branches: [release/family-6.0.47-secure-publish]
    paths: [.github/workflows/secure-publish-family-646.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.47-secure-publish
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2', cache-read-only: true}

      - name: Publish one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily647.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily647.key -out /tmp/ourfamily647.crt -days 1 -subj '/CN=OurFamily-6.0.47-One-Time/'
          mkdir -p updates/candidates/signed647
          cp /tmp/ourfamily647.crt updates/candidates/signed647/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed647/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.47 signing certificate'
          git push origin HEAD:release/family-6.0.47-secure-publish

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin release/family-6.0.47-secure-publish
            if git cat-file -e 'origin/release/family-6.0.47-secure-publish:updates/candidates/signed647/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/release/family-6.0.47-secure-publish:updates/candidates/signed647/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/release/family-6.0.47-secure-publish
              FOUND=1; break
            fi
            sleep 4
          done
          test "$FOUND" = 1

      - name: Decrypt signing material
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily647.crt -inkey /tmp/ourfamily647.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing647
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing647
          test -s /tmp/signing647/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing647/password.txt

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          H=duoapp/src/main/assets/index.html; J=duoapp/src/main/assets/arkanoid_joystick.js
          grep -q 'versionCode 6047' duoapp/build.gradle
          grep -q "versionName '6.0.47'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.47"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.47'" "$H"
          grep -q '<script src="arkanoid_joystick.js"></script>' "$H"
          grep -q '__ourFamilyArkanoidJoystickV1' "$J"
          grep -q 'ark-joy-track' "$J"
          grep -q 'dispatchPaddle' "$J"
          node --check "$J"
          node --check duoapp/src/main/assets/arkanoid.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs

      - name: Build unsigned APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"; U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_47_aligned.apk; S=/tmp/OurFamily_6_0_47_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing647/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/apksigner" sign --ks /tmp/signing647/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert647.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging647.txt
          grep -q "versionCode='6047'" /tmp/badging647.txt
          grep -q "versionName='6.0.47'" /tmp/badging647.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert647.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_47_Stable
          path: /tmp/OurFamily_6_0_47_Stable.apk

      - name: Build update payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_47_Stable.apk').read_bytes(); sha=hashlib.sha256(apk).hexdigest(); b64=base64.b64encode(apk).decode()
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]; parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v647_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'; urls=[]
          for i,c in enumerate(chunks):
            n=f'v647_{i:02d}.b64'; (parts/n).write_text(c); urls.append(base+n)
          meta={'versionCode':6047,'versionName':'6.0.47','apkBase64Parts':urls,'sha256':sha,'notes':'Арканоид: добавлен отдельный джойстик управления платформой. В вертикальном режиме джойстик расположен под игровым полем; в полноэкранном режиме для него выделена отдельная зона справа. Платформа движется плавно с пропорциональной скоростью в зависимости от отклонения ручки, а при отпускании сразу останавливается. Палец больше не закрывает платформу и точку отскока шара. Физика, скорость шара, звуки, видео и остальные игры не изменялись.'}
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'; Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/647.json').write_text(text); Path('updates/latest.json').write_text(text); Path('updates/downloads').mkdir(parents=True,exist_ok=True); Path('updates/downloads/OurFamily_6_0_47_Stable.apk').write_bytes(apk)
          print('READY',len(apk),len(chunks),sha)
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed647/encrypted_payload.b64 updates/candidates/signed647/ephemeral_cert.pem
          rmdir updates/candidates/signed647 2>/dev/null || true
          git config user.name ourfamily-release-bot; git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates; git commit -m 'Release OurFamily 6.0.47 stable candidate'; git push origin HEAD:release/family-6.0.47-secure-publish

      - name: Final verification
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text()); a=Path('updates/downloads/OurFamily_6_0_47_Stable.apk').read_bytes()
          assert m['versionCode']==6047 and m['versionName']=='6.0.47' and hashlib.sha256(a).hexdigest()==m['sha256']
          print('FINAL_READY',m['sha256'])
          PY
