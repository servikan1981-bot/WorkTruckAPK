name: Build OurFamily 6.0.48 joystick fix
on:
  push:
    branches: [release/family-6.0.48-secure-publish]
    paths: [.github/workflows/build-family-648-joystick.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.48-secure-publish
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare source
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('duoapp/build.gradle'); s=p.read_text(); s=s.replace('versionCode 6047','versionCode 6048').replace("versionName '6.0.47'","versionName '6.0.48'"); p.write_text(s)
          p=Path('duoapp/src/main/AndroidManifest.xml'); s=p.read_text().replace('Наша семья 6.0.47','Наша семья 6.0.48'); p.write_text(s)
          p=Path('duoapp/src/main/assets/index.html'); s=p.read_text().replace('6.0.47','6.0.48'); p.write_text(s)
          PY
          test -s duoapp/src/main/assets/arkanoid_joystick.js
          grep -q '<script src="arkanoid_joystick.js"></script>' duoapp/src/main/assets/index.html
          grep -q '__ourFamilyArkanoidJoystickV1=true' duoapp/src/main/assets/arkanoid_joystick.js
          node --check duoapp/src/main/assets/arkanoid_joystick.js
          node --check duoapp/src/main/assets/arkanoid.js
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html
          git commit -m 'Prepare OurFamily 6.0.48 joystick fix'
          git push origin HEAD:release/family-6.0.48-secure-publish
      - name: Build release APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Verify joystick inside APK
        shell: bash
        run: |
          set -e
          A=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          unzip -l "$A" | grep -q 'assets/arkanoid_joystick.js'
          unzip -p "$A" assets/index.html | grep -q '<script src="arkanoid_joystick.js"></script>'
          unzip -p "$A" assets/arkanoid_joystick.js | grep -q '__ourFamilyArkanoidJoystickV1=true'
          unzip -p "$A" assets/index.html | grep -q "APP_VERSION='6.0.48'"
          echo JOYSTICK_IS_INSIDE_APK
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_48_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
