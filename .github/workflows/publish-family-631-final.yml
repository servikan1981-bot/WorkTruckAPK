name: Publish OurFamily 6.0.31 final

on:
  push:
    branches: ['fix/family-6.0.31-signaling']
    paths:
      - 'updates/candidates/signed631/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.31-signaling
          fetch-depth: 1

      - name: Reconstruct signed 6.0.31 APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          parts=sorted(Path('updates/candidates/signed631').glob('part_*.b64'))
          assert parts, 'No signed631 parts found'
          raw=''.join(re.sub(r'\s+','',p.read_text(encoding='ascii')) for p in parts)
          apk=base64.b64decode(raw, validate=True)
          out=Path('/tmp/OurFamily_6_0_31_Stable.apk')
          out.write_bytes(apk)
          print('parts',len(parts),'bytes',len(apk),'sha256',hashlib.sha256(apk).hexdigest())
          assert apk[:4] == b'PK\x03\x04'
          PY

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Verify package, version and stable signing certificate
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=/tmp/OurFamily_6_0_31_Stable.apk
          OLD=updates/downloads/OurFamily_6_0_30_Stable.apk
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging.txt
          grep -q "versionCode='6031'" /tmp/badging.txt
          grep -q "versionName='6.0.31'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$OLD" > /tmp/old-cert.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/new-cert.txt
          OLD_CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/old-cert.txt | sed 's/.*: //')
          NEW_CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/new-cert.txt | sed 's/.*: //')
          test -n "$OLD_CERT" && test "$NEW_CERT" = "$OLD_CERT"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/new-cert.txt
          echo "Signer matches 6.0.30: $NEW_CERT"

      - name: Build update payload and metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          apk=Path('/tmp/OurFamily_6_0_31_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          Path('updates/parts').mkdir(parents=True,exist_ok=True)
          for p in Path('updates/parts').glob('v631_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v631_{i:02d}.b64'
              Path('updates/parts',name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6031,
            'versionName':'6.0.31',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Повышена надежность сообщений и видеозвонков. Добавлена автоматическая проверка уведомлений, канала «Семейные звонки» и разрешения полноэкранного входящего звонка на заблокированном экране.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates/631.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          out=Path('updates/downloads/OurFamily_6_0_31_Stable.apk')
          out.write_bytes(apk)
          rebuilt=base64.b64decode(''.join(Path('updates/parts',u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('chunks',len(chunks),'sha256',sha)
          PY

      - name: Commit verified 6.0.31 release payload
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/parts/v631_*.b64 updates/candidates/631.json updates/latest.json updates/downloads/OurFamily_6_0_31_Stable.apk
          git commit -m 'Release OurFamily 6.0.31 stable candidate'
          git push origin HEAD:fix/family-6.0.31-signaling

      - name: Final verification
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_31_Stable.apk').read_bytes()
          assert m['versionCode']==6031 and m['versionName']=='6.0.31'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('READY',m['versionName'],m['sha256'])
          PY
