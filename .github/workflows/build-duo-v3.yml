name: Build Duo Messenger v3 APK

on:
  workflow_dispatch:
  push:
    branches: [ duo-messenger-v3 ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - 'duoserver/**'
      - '.github/workflows/build-duo-v3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug

      - name: Verify APK
        run: |
          APK=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          test -s "$APK"
          echo "APK size:"
          ls -lh "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"

      - name: Rename APK
        run: cp duoapp/build/outputs/apk/debug/duoapp-debug.apk OurChat_v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OurChat_v3
          path: OurChat_v3.apk
          if-no-files-found: error
