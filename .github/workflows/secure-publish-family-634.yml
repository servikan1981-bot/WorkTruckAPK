name: Secure publish OurFamily 6.0.34

on:
  push:
    branches: ['fix/family-6.0.34-ludo-launch']
    paths:
      - '.github/workflows/secure-publish-family-634.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.34-ludo-launch
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Publish one-time encryption certificate
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily634.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily634.key -out /tmp/ourfamily634.crt -days 1 -subj '/CN=OurFamily-6.0.34-One-Time/'
          mkdir -p updates/candidates/signed634
          cp /tmp/ourfamily634.crt updates/candidates/signed634/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed634/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.34 signing certificate'
          git push origin HEAD:fix/family-6.0.34-ludo-launch

      - name: Wait for encrypted signing payload
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin fix/family-6.0.34-ludo-launch
            if git cat-file -e 'origin/fix/family-6.0.34-ludo-launch:updates/candidates/signed634/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/fix/family-6.0.34-ludo-launch:updates/candidates/signed634/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/fix/family-6.0.34-ludo-launch
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1

      - name: Decrypt signing material in runner only
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily634.crt -inkey /tmp/ourfamily634.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing634
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing634
          test -s /tmp/signing634/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing634/password.txt

      - name: Validate 6.0.34 source
        run: |
          set -euo pipefail
          grep -q "versionCode 6034" duoapp/build.gradle
          grep -q "versionName '6.0.34'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.34"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.34'" duoapp/src/main/assets/index.html
          python3 tools/test_family_634_ludo_launch.py
          node tools/test_ludo.cjs
          node --check duoapp/src/main/assets/ludo.js
          python3 -c "from pathlib import Path; import re; h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8'); Path('/tmp/family634.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S)),encoding='utf-8')"
          node --check /tmp/family634.js

      - name: Build unsigned 6.0.34 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Align sign and verify
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_34_aligned.apk
          S=/tmp/OurFamily_6_0_34_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing634/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign --ks /tmp/signing634/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert634.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging634.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging634.txt
          grep -q "versionCode='6034'" /tmp/badging634.txt
          grep -q "versionName='6.0.34'" /tmp/badging634.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert634.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert634.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert634.txt
          echo "Stable signer verified: $CERT"

      - name: Build update payload and metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          apk=Path('/tmp/OurFamily_6_0_34_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v634_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v634_{i:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6034,
            'versionName':'6.0.34',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Исправлен запуск игры «Семейная гонка»: экран игры теперь действительно открывается после приглашения. Добавлено ограничение выбора до 3 участников, понятный счетчик игроков и видимое сообщение при ошибке запуска. Остальной функционал 6.0.33 сохранён.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/634.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_34_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk
          assert hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY 6.0.34 bytes',len(apk),'parts',len(chunks),'sha256',sha)
          PY

      - name: Commit release to fix branch
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed634/encrypted_payload.b64 updates/candidates/signed634/ephemeral_cert.pem
          rmdir updates/candidates/signed634 2>/dev/null || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates duoapp tools
          git commit -m 'Release OurFamily 6.0.34 stable candidate'
          git push origin HEAD:fix/family-6.0.34-ludo-launch

      - name: Final verification
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_34_Stable.apk').read_bytes()
          assert m['versionCode']==6034 and m['versionName']=='6.0.34'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('FINAL_READY',m['versionName'],m['sha256'])
          PY
