name: OurFamily 6.0.19 call delivery on two emulators
on:
  push:
    branches: [family-stable-6]
    paths:
      - 'updates/candidates/619.json'
      - 'tools/call_delivery_family_619.py'
      - 'tools/call_delivery_family_619.sh'
      - '.github/workflows/call-delivery-family-619.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  call-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check invitations and video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash tools/call_delivery_family_619.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-619-call-diagnostics
          path: |
            /tmp/emulator-5554-call.log
            /tmp/emulator-5556-call.log
            /tmp/emulator-5554-screen.png
            /tmp/emulator-5556-screen.png
          if-no-files-found: ignore
