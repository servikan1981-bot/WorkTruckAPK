name: Build Our Family 6.0.4 Stable

on:
  workflow_dispatch:
  push:
    branches: [ family-stable-6 ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-6-stable.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate stable identity
        run: |
          grep -q "applicationId 'com.sergey.ourfamily'" duoapp/build.gradle
          grep -q "versionCode 6004" duoapp/build.gradle
          grep -q "versionName '6.0.4'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.4"' duoapp/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' duoapp/src/main/AndroidManifest.xml
          grep -q 'UpdateFileProvider' duoapp/src/main/AndroidManifest.xml

      - name: Validate JavaScript and retained functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks
          Path('/tmp/family6.js').write_text('\n'.join(blocks))
          assert "APP_VERSION='6.0.4'" in h
          PY
          node --check /tmp/family6.js
          H=duoapp/src/main/assets/index.html
          for token in direct_chat group_chat receipt_read REACTIONS openPhotoViewer scrollChatToBottom consumeNativeNavigation familyPresenceTopic openAdminArchiveScreen switchCamera enableSelfDrag startRingback speakerBtn "Семейные новости"; do
            grep -q "$token" "$H"
          done

      - name: Validate lock-screen call acceptance
        run: |
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          R=duoapp/src/main/java/com/sergey/duochat/CallActionReceiver.java
          I=duoapp/src/main/java/com/sergey/duochat/IncomingCallActivity.java
          M=duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q "CallStyle.forIncomingCall" "$S"
          grep -q "CallActionReceiver.ACTION_ACCEPT" "$S"
          grep -q "PendingIntent.getBroadcast" "$S"
          grep -q "ACTION_ACCEPT" "$R"
          grep -q "call_action" "$R"
          grep -q "FLAG_SHOW_WHEN_LOCKED" "$I"
          grep -q "FLAG_DISMISS_KEYGUARD" "$I"
          grep -q "applyCallWindowFlags" "$M"
          grep -q "canUseFullScreenIntent" "$M"

      - name: Validate Telecom lock-screen integration
        run: |
          T=duoapp/src/main/java/com/sergey/duochat/TelecomCallManager.java
          C=duoapp/src/main/java/com/sergey/duochat/FamilyConnectionService.java
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          M=duoapp/src/main/AndroidManifest.xml
          grep -q "addNewIncomingCall" "$T"
          grep -q "ACTION_CHANGE_PHONE_ACCOUNTS" "$T"
          grep -q "onCreateIncomingConnection" "$C"
          grep -q "onAnswer" "$C"
          grep -q "TelecomCallManager.reportIncomingCall" "$S"
          grep -q "BIND_TELECOM_CONNECTION_SERVICE" "$M"
          grep -q "android.telecom.ConnectionService" "$M"

      - name: Validate native presence and update notifications
        run: |
          P=duoapp/src/main/java/com/sergey/duochat/PresenceStore.java
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          U=duoapp/src/main/java/com/sergey/duochat/UpdateManager.java
          H=duoapp/src/main/assets/index.html
          grep -q "presence_native_v602" "$P"
          grep -q "startPresenceSender" "$S"
          grep -q "of5presence|" "$S"
          grep -q "FamilyDirectory.inboxTopic" "$S"
          grep -q "PresenceStore.update(this, senderRole" "$S"
          if grep -q "presenceListenLoop\|startPresenceListener\|pollPresenceNative" "$S"; then
            echo "Legacy separate presence reader must be removed"
            exit 1
          fi
          grep -q "UpdateManager.checkBackground" "$S"
          grep -q "15L \* 60L \* 1000L" "$S"
          grep -q "family_updates_v6" "$U"
          grep -q "Доступно обновление" "$U"
          grep -q "force_update_check" "$U"
          grep -q "AndroidBridge.loadPresence" "$H"
          grep -q "setTimeout(sendInvite,1600)" "$H"
          grep -q "setTimeout(sendInvite,4200)" "$H"

      - name: Validate fully native transport
        run: |
          H=duoapp/src/main/assets/index.html
          M=duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          R=duoapp/src/main/java/com/sergey/duochat/NativeRelayTransport.java
          A=duoapp/src/main/java/com/sergey/duochat/NativeAttachmentTransport.java
          if grep -q "fetch(" "$H"; then
            echo "WebView network fetch must not remain in stable 6.0.4"
            exit 1
          fi
          grep -q "AndroidBridge.sendRelay" "$H"
          grep -q "AndroidBridge.uploadAttachment" "$H"
          grep -q "AndroidBridge.downloadAttachment" "$H"
          grep -q "public String sendRelay" "$M"
          grep -q "postBlocking" "$R"
          grep -q "uploadBase64" "$A"
          grep -q "downloadBase64" "$A"
          grep -q "of5presence|" "$S"
          if grep -q "presenceListenLoop" "$S"; then
            echo "Separate presence stream must be removed in 6.0.4"
            exit 1
          fi

      - name: Validate update system
        run: |
          U=duoapp/src/main/java/com/sergey/duochat/UpdateManager.java
          P=duoapp/src/main/java/com/sergey/duochat/UpdateFileProvider.java
          M=duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q "latest.json" "$U"
          grep -q "sha256" "$U"
          grep -q "getPackageArchiveInfo" "$U"
          grep -q "canRequestPackageInstalls" "$U"
          grep -q "ACTION_MANAGE_UNKNOWN_APP_SOURCES" "$U"
          grep -q "updateprovider/update.apk" "$U"
          grep -q "ParcelFileDescriptor.MODE_READ_ONLY" "$P"
          grep -q "UpdateManager.checkAsync" "$M"

      - name: Build unsigned release APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify unsigned release
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "Наша семья 6.0.4"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_4_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error
