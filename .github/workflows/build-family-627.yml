name: Build OurFamily 6.0.27 TURN media fix
on:
  push:
    branches: [family-627-video]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check call signaling and build APK
        run: |
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('duoapp/src/main/assets/index.html').read_text()
          Path('/tmp/family627.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S)))
          PY
          node --check /tmp/family627.js
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk | grep -q "versionCode='6027' versionName='6.0.27'"
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_27_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error
