name: Build Our Family v5.4

on:
  workflow_dispatch:
  push:
    branches: [ family-v5-4-presence-receipts ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-v54.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks
          Path('/tmp/family-v54.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/family-v54.js

      - name: Validate About and version UI
        run: |
          H=duoapp/src/main/assets/index.html
          grep -q "О приложении" "$H"
          grep -q "aboutModal" "$H"
          grep -q "APP_VERSION='5.4'" "$H"
          grep -q "Наша семья · v5.4" "$H"
          grep -q 'return "5.4";' duoapp/src/main/java/com/sergey/duochat/MainActivity.java

      - name: Validate presence
        run: |
          H=duoapp/src/main/assets/index.html
          for token in familyPresenceTopic sendPresence pollPresence startPresence presenceMap presenceLabel "в сети" "не в сети"; do
            grep -q "$token" "$H"
          done

      - name: Validate delivery and read receipts
        run: |
          H=duoapp/src/main/assets/index.html
          for token in receipt_delivered receipt_read sendReceipt applyReceipt markThreadRead deliveredTo readBy "✓✓" "receipt read"; do
            grep -q "$token" "$H"
          done
          grep -q "sendFailed:false" "$H"

      - name: Validate existing features retained
        run: |
          H=duoapp/src/main/assets/index.html
          for token in direct_chat group_chat direct_invite direct_offer direct_answer direct_candidate group_invite group_join group_offer group_answer group_candidate "Семейные новости" switchCamera enableSelfDrag startRingback "История чатов" "layout-pip" "EMOJIS"; do
            grep -q "$token" "$H"
          done
          grep -q "RelayInbox.enqueue" duoapp/src/main/java/com/sergey/duochat/MessagingService.java

      - name: Build APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug

      - name: Verify APK
        run: |
          APK=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "Наша семья v5.4"
          unzip -p "$APK" assets/index.html | grep -q "receipt_read"
          unzip -p "$APK" assets/index.html | grep -q "familyPresenceTopic"
          ls -lh "$APK"

      - name: Rename APK
        run: cp duoapp/build/outputs/apk/debug/duoapp-debug.apk OurFamily_v5_4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_v5_4
          path: OurFamily_v5_4.apk
          if-no-files-found: error
