name: Verify OurFamily 6.0.30 games on two phones
on:
  push:
    branches: [family-630-games-fix]
    paths:
      - 'tools/game_family_630.py'
      - 'tools/game_family_630.sh'
      - '.github/workflows/games-family-630.yml'
      - 'tools/patch_family_630_games.py'
      - 'tools/patch_family_630_game_transport.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply final 6.0.30 games fixes and build debug APK
        run: |
          python3 tools/patch_family_630_games.py
          python3 tools/patch_family_630_game_transport.py
          grep -q 'relayBatchWireKind' duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q "var queued=nonBlocking&&/^urgent_broadcast\$/.test(wk);" duoapp/src/main/assets/index.html
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_family_624_async.cjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Invitations, turn order and background notifications
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/game_family_630.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-630-games-diagnostics
          path: |
            /tmp/emulator-5554-game.png
            /tmp/emulator-5556-game.png
            /tmp/emulator-5554-notifications.txt
            /tmp/emulator-5556-notifications.txt
            /tmp/second-emulator.log
          if-no-files-found: ignore
