name: Secure publish OurFamily 6.0.37

on:
  push:
    branches:
      - fix/family-6.0.37-media-cache
    paths:
      - .github/workflows/secure-publish-family-637.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.37-media-cache
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Publish one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily637.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily637.key -out /tmp/ourfamily637.crt -days 1 -subj '/CN=OurFamily-6.0.37-One-Time/'
          mkdir -p updates/candidates/signed637
          cp /tmp/ourfamily637.crt updates/candidates/signed637/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed637/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.37 signing certificate'
          git push origin HEAD:fix/family-6.0.37-media-cache
      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin fix/family-6.0.37-media-cache
            if git cat-file -e 'origin/fix/family-6.0.37-media-cache:updates/candidates/signed637/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/fix/family-6.0.37-media-cache:updates/candidates/signed637/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/fix/family-6.0.37-media-cache
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1
      - name: Decrypt signing material in runner only
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily637.crt -inkey /tmp/ourfamily637.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing637
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing637
          test -s /tmp/signing637/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing637/password.txt
      - name: Validate 6.0.37 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 6037" duoapp/build.gradle
          grep -q "versionName '6.0.37'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.37"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.37'" duoapp/src/main/assets/index.html
          grep -q 'function getAttachmentObjectUrl' duoapp/src/main/assets/index.html
          grep -q 'attachmentDownloadPending' duoapp/src/main/assets/index.html
          grep -q 'keptAttachments' duoapp/src/main/assets/index.html
          grep -q 'rememberMediaState' duoapp/src/main/assets/index.html
          grep -q "video.preload='auto'" duoapp/src/main/assets/index.html
          node tools/test_ludo.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          assert h.count('function renderAttachmentInto(')==1
          assert h.count('function getAttachmentObjectUrl(')==1
          assert h.count('function renderMessages(){')==1
          assert "b.appendChild(kept)" in h
          Path('/tmp/family637.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/family637.js
      - name: Build unsigned 6.0.37 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Align sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_37_aligned.apk
          S=/tmp/OurFamily_6_0_37_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing637/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign --ks /tmp/signing637/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert637.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging637.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging637.txt
          grep -q "versionCode='6037'" /tmp/badging637.txt
          grep -q "versionName='6.0.37'" /tmp/badging637.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert637.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert637.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert637.txt
      - name: Build update payload and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          apk=Path('/tmp/OurFamily_6_0_37_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v637_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v637_{i:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6037,
            'versionName':'6.0.37',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Исправлена повторная загрузка фото, видео и голосовых в чатах. Загруженные вложения сохраняются локально, активные медиа-элементы переиспользуются при перерисовке чата, повторные сетевые загрузки одного и того же файла объединяются, а видео и аудио сохраняют позицию воспроизведения. Остальной функционал 6.0.36 сохранён.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/637.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_37_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk
          assert hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY 6.0.37 bytes',len(apk),'parts',len(chunks),'sha256',sha)
          PY
      - name: Commit release to fix branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed637/encrypted_payload.b64 updates/candidates/signed637/ephemeral_cert.pem
          rmdir updates/candidates/signed637 2>/dev/null || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates
          git commit -m 'Release OurFamily 6.0.37 stable candidate'
          git push origin HEAD:fix/family-6.0.37-media-cache
      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_37_Stable.apk').read_bytes()
          assert m['versionCode']==6037 and m['versionName']=='6.0.37'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('FINAL_READY',m['versionName'],m['sha256'])
          PY
