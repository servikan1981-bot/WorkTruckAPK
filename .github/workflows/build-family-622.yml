name: Build OurFamily 6.0.22

on:
  push:
    branches: [family-622-menu, family-stable-6]
    paths:
      - 'tools/fix_family_621.py'
      - 'tools/fix_family_621_compile.py'
      - 'tools/fix_family_622_menu.py'
      - '.github/workflows/build-family-622.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply stable fixes through 6.0.22
        run: |
          python3 tools/fix_family_620_network.py
          python3 tools/fix_family_621.py
          python3 tools/fix_family_621_compile.py
          python3 tools/fix_family_622_menu.py

      - name: Validate 6.0.22 source
        run: |
          H=duoapp/src/main/assets/index.html
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          grep -q "versionCode 6022" duoapp/build.gradle
          grep -q "versionName '6.0.22'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.22"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.22'" "$H"
          grep -q 'urgentMenuBtn' "$H"
          grep -q "p.kind==='urgent_broadcast'" "$H"
          grep -q "peer==='sergey'" "$H"
          grep -q 'urgent_broadcast' "$S"
          grep -q 'id="more"' "$H"
          grep -q 'id="adminArchiveBtn"' "$H"
          ! grep -q 'id="menuBtn"' "$H"
          ! grep -q 'id="newsBtn"' "$H"
          python3 - <<'PY'
          from pathlib import Path
          h=Path('duoapp/src/main/assets/index.html').read_text()
          assert h.count('id="adminArchiveBtn"') == 1
          assert h.index('id="adminArchiveBtn"') > h.index('id="more"')
          assert 'id="urgentMenuBtn"' in h
          assert "showScreen('more')" in h
          PY
          grep -q 'CH_URGENT' "$S"
          grep -q 'setFullScreenIntent(pi, true)' "$S"
          grep -q 'notifyUrgent(eventTime > 0L ? eventTime : System.currentTimeMillis(), id);' "$S"
          grep -q 'iceCandidatePoolSize:12' "$H"
          grep -q 'stun4.l.google.com:19302' "$H"
          grep -q 'ps.restart<3' "$H"
          grep -q "iceConnectionState==='disconnected'" "$H"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          Path('/tmp/family621.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/family621.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs

      - name: Build unsigned 6.0.22
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify APK contents
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='6022' versionName='6.0.22'"
          unzip -p "$APK" assets/index.html | grep -q 'Срочное сообщение всем'
          unzip -p "$APK" assets/index.html | grep -q 'stun4.l.google.com:19302'
          sha256sum "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_21_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error
