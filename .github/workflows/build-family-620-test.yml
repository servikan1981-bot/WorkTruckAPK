name: Build Our Family 6.0.20 Games Test

on:
  workflow_dispatch:
  push:
    branches: [ family-6.0.20-games ]
    paths:
      - 'duoapp/**'
      - '.github/workflows/build-family-620-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Inject 6.0.20 game layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('duoapp/src/main/assets/index.html')
          s=h.read_text()
          d=Path('duoapp/src/main/assets/durak.js').read_text()
          marker='<script src="checkers.js"></script>'
          assert marker in s
          s=s.replace(marker, marker+'\n<script>\n'+d+'\n</script>',1)
          s=s.replace('6.0.19','6.0.20')
          h.write_text(s)
          m=Path('duoapp/src/main/AndroidManifest.xml')
          x=m.read_text().replace('Наша семья 6.0.19','Наша семья 6.0.20')
          m.write_text(x)
          PY

      - name: Validate 6.0.20 games
        run: |
          grep -q "versionCode 6020" duoapp/build.gradle
          grep -q "versionName '6.0.20'" duoapp/build.gradle
          grep -q "Наша семья · v6.0.20" duoapp/src/main/assets/index.html
          grep -q "APP_VERSION='6.0.20'" duoapp/src/main/assets/index.html
          grep -q "Шашки и Дурак" duoapp/src/main/assets/index.html
          grep -q "OF_DURAK" duoapp/src/main/assets/index.html
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs

      - name: Build release APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify APK
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "Наша семья · v6.0.20"
          unzip -p "$APK" assets/durak.js | grep -q "OF_DURAK"
          sha256sum "$APK"

      - name: Upload 6.0.20 test APK
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_20_games_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error

      - name: Package Android signing tools
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$BT/apksigner" "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          if [ -d "$BT/lib64" ]; then cp -a "$BT/lib64/." signing-tools/lib64/; fi
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-620
          path: signing-tools
          if-no-files-found: error
