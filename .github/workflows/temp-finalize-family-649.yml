name: Finalize OurFamily 6.0.49 stable inline joystick
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-finalize-family-649.yml]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.49-arkanoid-joystick-inline
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Download already verified signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/servikan1981-bot/WorkTruckAPK/actions/artifacts/11257808849/zip' -o /tmp/a649.zip
          mkdir -p /tmp/a649
          unzip -q /tmp/a649.zip -d /tmp/a649
          test -s /tmp/a649/OurFamily_6_0_49_Stable.apk
      - name: Reverify signed APK before publication
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/a649/OurFamily_6_0_49_Stable.apk; BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging.txt
          grep -q "versionCode='6049'" /tmp/badging.txt
          grep -q "versionName='6.0.49'" /tmp/badging.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert.txt
          unzip -p "$S" assets/arkanoid.js > /tmp/arkanoid649.js
          unzip -p "$S" assets/index.html > /tmp/index649.html
          grep -q '__ourFamilyArkanoidJoystickInline=true' /tmp/arkanoid649.js
          grep -q 'id="arkJoyDock"' /tmp/arkanoid649.js
          grep -q 'id="arkJoyTrack"' /tmp/arkanoid649.js
          grep -q 'bindJoystick();' /tmp/arkanoid649.js
          grep -q 'function movePaddleDirect' /tmp/arkanoid649.js
          grep -q 'Управляйте платформой джойстиком' /tmp/arkanoid649.js
          ! grep -q 'Ведите пальцем по игровому полю' /tmp/arkanoid649.js
          ! grep -q '<script src="arkanoid_joystick.js"></script>' /tmp/index649.html
      - name: Create updater payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,zipfile
          src=Path('/tmp/a649/OurFamily_6_0_49_Stable.apk')
          apk=src.read_bytes(); sha=hashlib.sha256(apk).hexdigest()
          with zipfile.ZipFile(src) as z:
              a=z.read('assets/arkanoid.js').decode('utf-8'); i=z.read('assets/index.html').decode('utf-8')
              assert '__ourFamilyArkanoidJoystickInline=true' in a
              assert 'id="arkJoyDock"' in a and 'id="arkJoyTrack"' in a and 'function movePaddleDirect' in a
              assert 'Управляйте платформой джойстиком' in a and 'Ведите пальцем по игровому полю' not in a
              assert '<script src="arkanoid_joystick.js"></script>' not in i and "APP_VERSION='6.0.49'" in i
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v649_*.b64'): p.unlink()
          b64=base64.b64encode(apk).decode('ascii'); chunks=[b64[n:n+16000] for n in range(0,len(b64),16000)]
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for n,c in enumerate(chunks):
              name=f'v649_{n:02d}.b64'; (parts/name).write_text(c,encoding='ascii'); urls.append(base+name)
          meta={'versionCode':6049,'versionName':'6.0.49','apkBase64Parts':urls,'sha256':sha,'notes':'Арканоид: джойстик встроен непосредственно в arkanoid.js и создаётся вместе с игровым экраном. Отдельный модуль джойстика больше не подключается. В обычном режиме управление находится под игровым полем, в полноэкранном — справа. Джойстик напрямую двигает платформу. Старая инструкция про ведение пальцем удалена. Остальные функции приложения не изменялись.'}
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/candidates').mkdir(parents=True,exist_ok=True); Path('updates/candidates/649.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True); Path('updates/downloads/OurFamily_6_0_49_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts / u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('PUBLISH_649',len(apk),len(chunks),sha)
          PY
      - name: Commit stable candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf updates/candidates/signed649
          rm -f .github/workflows/prepare-family-649-inline-joystick.yml tools/prepare_649.py
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A
          git commit -m 'Release OurFamily 6.0.49 stable inline Arkanoid joystick'
          git push origin HEAD:release/family-6.0.49-arkanoid-joystick-inline
      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,base64,zipfile
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          ap=Path('updates/downloads/OurFamily_6_0_49_Stable.apk'); apk=ap.read_bytes()
          assert m['versionCode']==6049 and m['versionName']=='6.0.49'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          parts=Path('updates/parts'); rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in m['apkBase64Parts']))
          assert rebuilt==apk
          with zipfile.ZipFile(ap) as z:
              a=z.read('assets/arkanoid.js').decode('utf-8'); i=z.read('assets/index.html').decode('utf-8')
              assert '__ourFamilyArkanoidJoystickInline=true' in a and 'id="arkJoyDock"' in a
              assert '<script src="arkanoid_joystick.js"></script>' not in i
          print('FINAL_VERIFIED_649',m['sha256'])
          PY
