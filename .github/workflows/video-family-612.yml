name: OurFamily 6.0.12 two-device video
on:
  push:
    branches: [family-stable-6]
    paths:
      - 'tools/video_family_612.py'
      - 'tools/video_family_612.sh'
      - '.github/workflows/video-family-612.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Call between two Android emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash tools/video_family_612.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-video-612-evidence
          path: |
            /tmp/emulator-5554.xml
            /tmp/emulator-5556.xml
            /tmp/emulator-5554.png
            /tmp/emulator-5556.png
            /tmp/emulator-5554-crash.log
            /tmp/emulator-5556-crash.log
            /tmp/second-emulator.log
          if-no-files-found: ignore
