name: Secure publish OurFamily 6.0.32

on:
  push:
    branches: ['feature/family-6.0.32-voice-video']
    paths:
      - '.github/workflows/secure-publish-family-632.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-6.0.32-voice-video
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Publish one-time encryption certificate
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily632.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily632.key \
            -out /tmp/ourfamily632.crt -days 1 -subj '/CN=OurFamily-6.0.32-One-Time/'
          mkdir -p updates/candidates/signed632
          cp /tmp/ourfamily632.crt updates/candidates/signed632/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed632/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.32 signing certificate'
          git push origin HEAD:feature/family-6.0.32-voice-video

      - name: Wait for encrypted signing payload
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin feature/family-6.0.32-voice-video
            if git cat-file -e 'origin/feature/family-6.0.32-voice-video:updates/candidates/signed632/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/feature/family-6.0.32-voice-video:updates/candidates/signed632/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/feature/family-6.0.32-voice-video
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1

      - name: Decrypt signing material in runner only
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/signing_payload.cms \
            -recip /tmp/ourfamily632.crt \
            -inkey /tmp/ourfamily632.key \
            -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing632
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing632
          test -s /tmp/signing632/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing632/password.txt

      - name: Validate 6.0.32 source
        run: |
          set -euo pipefail
          grep -q "versionCode 6032" duoapp/build.gradle
          grep -q "versionName '6.0.32'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.32"' duoapp/src/main/AndroidManifest.xml
          H=duoapp/src/main/assets/index.html
          grep -q "APP_VERSION='6.0.32'" "$H"
          grep -q 'id="micBtn"' "$H"
          grep -q 'captureChatVideoBtn' "$H"
          grep -q 'attachment-audio' "$H"
          grep -q 'VOICE_MAX_MS=300000' "$H"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          Path('/tmp/family632.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/family632.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js

      - name: Build unsigned 6.0.32 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Align, sign and verify
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_32_aligned.apk
          S=/tmp/OurFamily_6_0_32_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing632/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign \
            --ks /tmp/signing632/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 \
            --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging.txt
          grep -q "versionCode='6032'" /tmp/badging.txt
          grep -q "versionName='6.0.32'" /tmp/badging.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert.txt
          echo "Stable signer verified: $CERT"

      - name: Build update payload and metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_32_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          Path('updates/parts').mkdir(parents=True,exist_ok=True)
          for p in Path('updates/parts').glob('v632_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v632_{i:02d}.b64'
              Path('updates/parts',name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6032,
            'versionName':'6.0.32',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Добавлены голосовые сообщения и возможность снять видео камерой телефона прямо из чата и сразу отправить его. Сохранены исправления надежности сообщений, звонков и полноэкранного входящего вызова из 6.0.31.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/632.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_32_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join(Path('updates/parts',u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('version 6.0.32 bytes',len(apk),'parts',len(chunks),'sha256',sha)
          PY

      - name: Commit release to feature branch
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed632/encrypted_payload.b64 updates/candidates/signed632/ephemeral_cert.pem
          rmdir updates/candidates/signed632 2>/dev/null || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates duoapp .github/workflows
          git commit -m 'Release OurFamily 6.0.32 stable candidate'
          git push origin HEAD:feature/family-6.0.32-voice-video

      - name: Final verification
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_32_Stable.apk').read_bytes()
          assert m['versionCode']==6032 and m['versionName']=='6.0.32'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('READY',m['versionName'],m['sha256'])
          PY
