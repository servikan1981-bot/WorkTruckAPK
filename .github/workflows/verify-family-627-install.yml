name: Verify OurFamily 6.0.27 upgrade on Android 13
on:
  push:
    branches: [family-627-video]
    paths:
      - '.github/workflows/verify-family-627-install.yml'
      - 'updates/downloads/OurFamily_6_0_27_Stable.apk'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify release packages
        run: |
          echo 'b844fb43d7000d79e499784fd975f7cf277b71684521ad8f19f6f73c9c0ca4f9  updates/downloads/OurFamily_6_0_27_Stable.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 updates/downloads/OurFamily_6_0_27_Stable.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs updates/downloads/OurFamily_6_0_27_Stable.apk | tee /tmp/cert627.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs updates/downloads/OurFamily_6_0_26_Stable.apk | tee /tmp/cert626.txt
          grep -qi '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83' /tmp/cert627.txt
          grep -qi '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83' /tmp/cert626.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging updates/downloads/OurFamily_6_0_27_Stable.apk | grep -q "versionCode='6027' versionName='6.0.27'"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade and launch on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r updates/downloads/OurFamily_6_0_26_Stable.apk
            adb install -r updates/downloads/OurFamily_6_0_27_Stable.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m 1 'versionCode=6027'
            adb shell monkey -p com.sergey.ourfamily 1
            sleep 3
            adb shell pidof com.sergey.ourfamily
