name: Build Our Family v5.3

on:
  workflow_dispatch:
  push:
    branches: [ family-v5-3-polish ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-v53.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks
          Path('/tmp/family-v53.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/family-v53.js

      - name: Validate calls and camera
        run: |
          H=duoapp/src/main/assets/index.html
          grep -q "startRingback" "$H"
          grep -q "speakerBtn" "$H"
          grep -q "setSpeakerphone" duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q "enumerateDevices" "$H"
          grep -q "deviceId:{exact" "$H"
          grep -q "replaceTrack" "$H"
          grep -q "enableSelfDrag" "$H"
          grep -q "floating-self" "$H"

      - name: Validate news and direct capture
        run: |
          H=duoapp/src/main/assets/index.html
          grep -q "newsCapturePhotoInput" "$H"
          grep -q "newsCaptureVideoInput" "$H"
          grep -q "capture=\"environment\"" "$H"
          grep -q "loadAutoNews" "$H"
          grep -q "auto-news" "$H"
          grep -q "PositiveNewsFetcher" duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          grep -q "wildcar.org/news/rss.xml" duoapp/src/main/java/com/sergey/duochat/PositiveNewsFetcher.java
          grep -q "goodnewsnetwork.org/category/news/feed" duoapp/src/main/java/com/sergey/duochat/PositiveNewsFetcher.java
          grep -q "positive.news/feed" duoapp/src/main/java/com/sergey/duochat/PositiveNewsFetcher.java

      - name: Validate archive and icon
        run: |
          H=duoapp/src/main/assets/index.html
          grep -q "openAdminArchiveScreen" "$H"
          grep -q "m.kind==='admin'" "$H"
          grep -q "m.kind==='direct'" "$H"
          grep -q "m.kind==='group'" "$H"
          grep -q "family silhouettes" /dev/null || true
          grep -q "M31,34" duoapp/src/main/res/drawable/ic_launcher.xml

      - name: Validate existing features retained
        run: |
          H=duoapp/src/main/assets/index.html
          for token in direct_chat group_chat direct_invite direct_offer direct_answer direct_candidate group_invite group_join group_offer group_answer group_candidate "История чатов" "layout-side" "layout-stack" "layout-pip" "data-theme-choice=\"dark\"" "EMOJIS" "Семейные новости"; do
            grep -q "$token" "$H"
          done
          grep -q "RelayInbox.enqueue" duoapp/src/main/java/com/sergey/duochat/MessagingService.java

      - name: Build APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug

      - name: Verify APK
        run: |
          APK=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "Наша семья v5.3"
          unzip -p "$APK" assets/index.html | grep -q "speakerBtn"
          unzip -p "$APK" assets/index.html | grep -q "auto-news"
          unzip -p "$APK" assets/index.html | grep -q "enableSelfDrag"
          ls -lh "$APK"

      - name: Rename APK
        run: cp duoapp/build/outputs/apk/debug/duoapp-debug.apk OurFamily_v5_3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_v5_3
          path: OurFamily_v5_3.apk
          if-no-files-found: error
