name: Secure publish OurFamily 6.0.42

on:
  push:
    branches:
      - release/family-6.0.42-billiards-audio
    paths:
      - .github/workflows/secure-publish-family-642.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.42-billiards-audio
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Publish one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily642.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily642.key -out /tmp/ourfamily642.crt -days 1 -subj '/CN=OurFamily-6.0.42-One-Time/'
          mkdir -p updates/candidates/signed642
          cp /tmp/ourfamily642.crt updates/candidates/signed642/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed642/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.42 signing certificate'
          git push origin HEAD:release/family-6.0.42-billiards-audio

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin release/family-6.0.42-billiards-audio
            if git cat-file -e 'origin/release/family-6.0.42-billiards-audio:updates/candidates/signed642/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/release/family-6.0.42-billiards-audio:updates/candidates/signed642/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/release/family-6.0.42-billiards-audio
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1

      - name: Decrypt signing material in runner only
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily642.crt -inkey /tmp/ourfamily642.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing642
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing642
          test -s /tmp/signing642/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing642/password.txt

      - name: Validate 6.0.42 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 6042" duoapp/build.gradle
          grep -q "versionName '6.0.42'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.42"' duoapp/src/main/AndroidManifest.xml
          grep -q 'String\[\] gameRuleAssets = {"checkers.js", "durak.js", "billiards.js"};' duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q 'AudioAttributes.USAGE_GAME' duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q 'AudioTrack.WRITE_BLOCKING' duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q 'playPoolSound(String kind, int strengthPercent)' duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q 'poolPlayCueSound' duoapp/src/main/assets/index.html
          grep -q 'poolPlayBallSound' duoapp/src/main/assets/index.html
          grep -q 'sx>1.2' duoapp/src/main/assets/billiards.js
          grep -q 'bb.vx\*=.9965' duoapp/src/main/assets/billiards.js
          node --check duoapp/src/main/assets/billiards.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_billiards.cjs

      - name: Build unsigned APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Align sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_42_aligned.apk
          S=/tmp/OurFamily_6_0_42_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing642/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign --ks /tmp/signing642/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert642.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging642.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging642.txt
          grep -q "versionCode='6042'" /tmp/badging642.txt
          grep -q "versionName='6.0.42'" /tmp/badging642.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert642.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert642.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert642.txt

      - name: Build update payload and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          apk=Path('/tmp/OurFamily_6_0_42_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v642_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v642_{i:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6042,
            'versionName':'6.0.42',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Бильярд 8-ball: восстановлены слышимые звуки удара кия по битку и столкновений шаров; добавлен звук ударов шаров о борта; нативный Android-аудиовывод переведён на режим GAME/SONIFICATION с поддержкой одновременных коротких ударов. Исправлена гарантированная загрузка billiards.js. Полноэкранный режим сохранён. Чаты, фото, видео и звонки не изменялись.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/642.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_42_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk
          assert hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY',len(apk),len(chunks),sha)
          PY

      - name: Commit signed release to release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed642/encrypted_payload.b64 updates/candidates/signed642/ephemeral_cert.pem
          rmdir updates/candidates/signed642 2>/dev/null || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates
          git commit -m 'Release OurFamily 6.0.42 stable candidate'
          git push origin HEAD:release/family-6.0.42-billiards-audio

      - name: Publish clean release tree to stable branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin family-stable-6
          rm -rf /tmp/stable642
          git worktree add --detach /tmp/stable642 origin/family-stable-6
          for f in \
            duoapp/build.gradle \
            duoapp/src/main/AndroidManifest.xml \
            duoapp/src/main/assets/index.html \
            duoapp/src/main/assets/billiards.js \
            duoapp/src/main/java/com/sergey/duochat/MainActivity.java; do
            mkdir -p "/tmp/stable642/$(dirname "$f")"
            cp "$f" "/tmp/stable642/$f"
          done
          mkdir -p /tmp/stable642/updates/candidates /tmp/stable642/updates/downloads /tmp/stable642/updates/parts
          cp updates/latest.json /tmp/stable642/updates/latest.json
          cp updates/candidates/642.json /tmp/stable642/updates/candidates/642.json
          cp updates/downloads/OurFamily_6_0_42_Stable.apk /tmp/stable642/updates/downloads/OurFamily_6_0_42_Stable.apk
          rm -f /tmp/stable642/updates/parts/v642_*.b64
          cp updates/parts/v642_*.b64 /tmp/stable642/updates/parts/
          cd /tmp/stable642
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html duoapp/src/main/assets/billiards.js duoapp/src/main/java/com/sergey/duochat/MainActivity.java updates/latest.json updates/candidates/642.json updates/downloads/OurFamily_6_0_42_Stable.apk updates/parts/v642_*.b64
          git commit -m 'Publish OurFamily 6.0.42 stable'
          git push origin HEAD:family-stable-6

      - name: Final stable verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin family-stable-6
          git show origin/family-stable-6:updates/latest.json > /tmp/live642.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/live642.json',encoding='utf-8'))
          assert m['versionCode']==6042 and m['versionName']=='6.0.42'
          assert len(m['apkBase64Parts'])>=10
          print('LIVE',m['versionName'],m['sha256'],len(m['apkBase64Parts']))
          PY
