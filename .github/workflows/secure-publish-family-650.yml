name: Build and publish OurFamily 6.0.50 Ocean
on:
  push:
    branches: [release/family-6.0.50-ocean-redesign]
    paths:
      - 'duoapp/**'
      - '.github/workflows/secure-publish-family-650.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.50-ocean-redesign
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate Ocean 6.0.50 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 6050' duoapp/build.gradle
          grep -q "versionName '6.0.50'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.50"' duoapp/src/main/AndroidManifest.xml
          H=duoapp/src/main/assets/index.html
          grep -q "APP_VERSION='6.0.50'" "$H"
          grep -q 'id="design650"' "$H"
          grep -q -- '--ocean-3:#2d7ff9' "$H"
          grep -q 'id="bottomNav"' "$H"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks
          Path('/tmp/family650-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          assert "APP_VERSION='6.0.50'" in h
          assert h.count('id="design650"')==1
          PY
          node --check /tmp/family650-inline.js
          for f in checkers.js durak.js billiards.js arkanoid.js; do node --check "duoapp/src/main/assets/$f"; done
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs
      - name: Publish one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily650.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily650.key -out /tmp/ourfamily650.crt -days 1 -subj '/CN=OurFamily-6.0.50-One-Time/'
          mkdir -p updates/candidates/signed650
          cp /tmp/ourfamily650.crt updates/candidates/signed650/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed650/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.50 signing certificate'
          git push origin HEAD:release/family-6.0.50-ocean-redesign
      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 180); do
            git fetch origin release/family-6.0.50-ocean-redesign
            OK=1
            for p in 0 1 2 3; do
              git cat-file -e "origin/release/family-6.0.50-ocean-redesign:updates/candidates/signed650/encrypted_payload.part${p}" 2>/dev/null || OK=0
            done
            if [ "$OK" = 1 ]; then
              : > /tmp/encrypted_payload.b64
              for p in 0 1 2 3; do git show "origin/release/family-6.0.50-ocean-redesign:updates/candidates/signed650/encrypted_payload.part${p}" >> /tmp/encrypted_payload.b64; done
              git reset --hard origin/release/family-6.0.50-ocean-redesign
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1
      - name: Decrypt signing material
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily650.crt -inkey /tmp/ourfamily650.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing650
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing650
          test -s /tmp/signing650/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing650/password.txt
      - name: Build unsigned APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Verify unsigned APK contains Ocean redesign
        shell: bash
        run: |
          set -euo pipefail
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$U"
          unzip -p "$U" assets/index.html > /tmp/index650.html
          grep -q "APP_VERSION='6.0.50'" /tmp/index650.html
          grep -q 'id="design650"' /tmp/index650.html
          grep -q -- '--ocean-3:#2d7ff9' /tmp/index650.html
          grep -q 'id="bottomNav"' /tmp/index650.html
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$U" > /tmp/badging650u.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging650u.txt
          grep -q "versionCode='6050'" /tmp/badging650u.txt
          grep -q "versionName='6.0.50'" /tmp/badging650u.txt
      - name: Align sign and verify final APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_50_aligned.apk
          S=/tmp/OurFamily_6_0_50_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing650/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign --ks /tmp/signing650/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert650.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging650.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging650.txt
          grep -q "versionCode='6050'" /tmp/badging650.txt
          grep -q "versionName='6.0.50'" /tmp/badging650.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert650.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert650.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert650.txt
          unzip -p "$S" assets/index.html | grep -q 'id="design650"'
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_50_Stable
          path: /tmp/OurFamily_6_0_50_Stable.apk
          if-no-files-found: error
      - name: Build update payload and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_50_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[x:x+16000] for x in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v650_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for n,c in enumerate(chunks):
              name=f'v650_{n:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={'versionCode':6050,'versionName':'6.0.50','apkBase64Parts':urls,'sha256':sha,'notes':'Кардинальный редизайн «Океан»: новый светло-голубой визуальный язык, стеклянные карточки, объёмные панели, новая домашняя лента, крупный блок участников, плавающая нижняя навигация и обновлённые экраны чатов, игр, новостей и меню. Логика чатов, файлов, звонков, игр и WebRTC не менялась.'}
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/650.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_50_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY_650',len(apk),len(chunks),sha)
          PY
      - name: Commit release payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf updates/candidates/signed650
          rm -f .github/workflows/secure-publish-family-650.yml
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates .github/workflows/secure-publish-family-650.yml
          git commit -m 'Release OurFamily 6.0.50 Ocean redesign'
          git push origin HEAD:release/family-6.0.50-ocean-redesign
      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_50_Stable.apk').read_bytes()
          assert m['versionCode']==6050 and m['versionName']=='6.0.50'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          rebuilt=base64.b64decode(''.join(Path('updates/parts',u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in m['apkBase64Parts']))
          assert rebuilt==apk
          print('FINAL_VERIFIED_650',m['sha256'])
          PY
