name: Secure sign and publish OurFamily 6.0.31

on:
  push:
    branches: ['fix/family-6.0.31-signaling']
    paths:
      - '.github/workflows/secure-sign-publish-631.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secure-sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.31-signaling
          fetch-depth: 0

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Create one-time encryption certificate
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily631-ephemeral.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily631-ephemeral.key \
            -out /tmp/ourfamily631-ephemeral.crt -days 1 -subj '/CN=OurFamily-6.0.31-One-Time/'
          mkdir -p updates/candidates/signed631
          cp /tmp/ourfamily631-ephemeral.crt updates/candidates/signed631/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed631/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.31 signing certificate'
          git push origin HEAD:fix/family-6.0.31-signaling

      - name: Wait for encrypted signing payload
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 120); do
            git fetch origin fix/family-6.0.31-signaling
            if git cat-file -e 'origin/fix/family-6.0.31-signaling:updates/candidates/signed631/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/fix/family-6.0.31-signaling:updates/candidates/signed631/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/fix/family-6.0.31-signaling
              FOUND=1
              break
            fi
            sleep 5
          done
          test "$FOUND" = 1

      - name: Decrypt signing key only in runner memory
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/signing_payload.cms \
            -recip /tmp/ourfamily631-ephemeral.crt \
            -inkey /tmp/ourfamily631-ephemeral.key \
            -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing631
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing631
          test -s /tmp/signing631/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing631/password.txt

      - name: Reconstruct, align and sign exact final candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re,hashlib
          parts=sorted(Path('updates/candidates/unsigned631').glob('part_*.b64'))
          assert parts
          raw=''.join(re.sub(r'\s+','',p.read_text(encoding='ascii')) for p in parts)
          apk=base64.b64decode(raw,validate=True)
          Path('/tmp/OurFamily_6_0_31_unsigned.apk').write_bytes(apk)
          print('unsigned',len(apk),hashlib.sha256(apk).hexdigest())
          PY
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PASS=$(tr -d '\r\n' < /tmp/signing631/password.txt)
          "$BT/zipalign" -p -f 4 /tmp/OurFamily_6_0_31_unsigned.apk /tmp/OurFamily_6_0_31_aligned.apk
          "$BT/zipalign" -c -v 4 /tmp/OurFamily_6_0_31_aligned.apk >/dev/null
          "$BT/apksigner" sign \
            --ks /tmp/signing631/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 \
            --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/OurFamily_6_0_31_Stable.apk /tmp/OurFamily_6_0_31_aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_31_Stable.apk > /tmp/new-cert.txt
          "$BT/aapt" dump badging /tmp/OurFamily_6_0_31_Stable.apk > /tmp/badging.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging.txt
          grep -q "versionCode='6031'" /tmp/badging.txt
          grep -q "versionName='6.0.31'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.sergey.duochat.PermissionGateActivity'" /tmp/badging.txt

      - name: Verify same certificate as live 6.0.30
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OLD=updates/downloads/OurFamily_6_0_30_Stable.apk
          "$BT/apksigner" verify --verbose --print-certs "$OLD" > /tmp/old-cert.txt
          OLD_CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/old-cert.txt | sed 's/.*: //')
          NEW_CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/new-cert.txt | sed 's/.*: //')
          test -n "$OLD_CERT" && test -n "$NEW_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/new-cert.txt
          echo "Certificate continuity verified: $NEW_CERT"

      - name: Build live 6.0.31 update payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_31_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          Path('updates/parts').mkdir(parents=True,exist_ok=True)
          for p in Path('updates/parts').glob('v631_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v631_{i:02d}.b64'
              Path('updates/parts',name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6031,
            'versionName':'6.0.31',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Повышена надежность сообщений и видеозвонков. Добавлена автоматическая проверка уведомлений, канала «Семейные звонки» и разрешения полноэкранного входящего звонка на заблокированном экране.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates/631.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads/OurFamily_6_0_31_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join(Path('updates/parts',u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('release',len(apk),'chunks',len(chunks),'sha256',sha)
          PY

      - name: Remove one-time encrypted materials and publish
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed631/encrypted_payload.b64 updates/candidates/signed631/ephemeral_cert.pem
          git add -A updates .github/workflows
          git commit -m 'Release OurFamily 6.0.31 stable'
          git push origin HEAD:fix/family-6.0.31-signaling
          git push origin HEAD:family-stable-6

      - name: Final live metadata check
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_31_Stable.apk').read_bytes()
          assert m['versionCode']==6031 and m['versionName']=='6.0.31'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('LIVE',m['versionName'],m['sha256'])
          PY
