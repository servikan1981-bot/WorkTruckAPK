name: Diagnose OurFamily 6.0.30 signer

on:
  push:
    branches: [family-630-game-fix]
    paths: ['.github/workflows/diagnose-family-630-signer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch production 6.0.29 and build CI debug key
        run: |
          set -euo pipefail
          git fetch origin family-stable-6:refs/remotes/origin/family-stable-6
          git show origin/family-stable-6:updates/downloads/OurFamily_6_0_29_Stable.apk > /tmp/629.apk
          python3 tools/patch_family_630.py
          python3 tools/patch_family_630_call.py
          python3 tools/patch_family_630_fastrelay.py
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug
      - name: Compare certificates
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          DBG=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          "$S" verify --verbose --print-certs /tmp/629.apk | tee /tmp/prod.txt
          "$S" verify --verbose --print-certs "$DBG" | tee /tmp/debug.txt
          PROD=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/prod.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          DEBUG=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/debug.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          echo "PROD_CERT=$PROD"
          echo "DEBUG_CERT=$DEBUG"
          if [ "$PROD" = "$DEBUG" ]; then echo 'MATCH=YES'; else echo 'MATCH=NO'; fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Alias name:|SHA256:' || true
