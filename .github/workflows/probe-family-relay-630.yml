name: Probe OurFamily live relay latency

on:
  push:
    branches: [ family-630-game-fix ]
    paths:
      - '.github/workflows/probe-family-relay-630.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare home and legacy relay paths
        shell: bash
        env:
          HOME_RELAY: https://family.familysergey.netcraze.pro
          BACKUP_RELAY: https://our-family-relay.family-860c7981b2d4.workers.dev
        run: |
          set -u
          probe_one() {
            NAME="$1"; RELAY="$2"; TOPIC="probe630$(date +%s)$RANDOM"
            echo "=== $NAME : health ==="
            for i in 1 2 3; do
              curl --connect-timeout 6 --max-time 12 -sS -o /dev/null \
                -w "$NAME health $i connect=%{time_connect}s tls=%{time_appconnect}s first=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n" \
                "$RELAY/health" || echo "$NAME health $i FAILED"
            done
            echo "=== $NAME : priority-5 POST ==="
            for i in 1 2 3; do
              BODY=$(printf '{"topic":"%s","message":"of5|probe|target|direct_accept|-|g|0|1|signal-%s","priority":5}' "$TOPIC" "$i")
              curl --connect-timeout 6 --max-time 12 -sS -o /dev/null \
                -H 'Content-Type: application/json' -d "$BODY" \
                -w "$NAME post $i connect=%{time_connect}s tls=%{time_appconnect}s first=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n" \
                "$RELAY/" || echo "$NAME post $i FAILED"
            done
            echo "=== $NAME : SDP batch ==="
            python3 - "$TOPIC" > /tmp/batch.json <<'PY'
          import json,sys
          topic=sys.argv[1]
          pad='A'*1680
          messages=[f'of5|probe|target|direct_offer|call|grp|{i}|6|{pad}{i}' for i in range(6)]
          print(json.dumps({'topic':topic,'messages':messages,'priority':5}))
          PY
            for i in 1 2 3; do
              curl --connect-timeout 6 --max-time 14 -sS -o /dev/null \
                -H 'Content-Type: application/json' --data-binary @/tmp/batch.json \
                -w "$NAME batch $i connect=%{time_connect}s tls=%{time_appconnect}s first=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n" \
                "$RELAY/" || echo "$NAME batch $i FAILED"
            done
          }
          probe_one HOME "$HOME_RELAY"
          probe_one BACKUP "$BACKUP_RELAY"
