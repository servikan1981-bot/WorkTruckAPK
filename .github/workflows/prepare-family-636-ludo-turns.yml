name: Prepare OurFamily 6.0.36 Ludo turns

on:
  push:
    branches:
      - fix/family-6.0.36-ludo-turns
    paths:
      - .github/workflows/prepare-family-636-ludo-turns.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-6.0.36-ludo-turns
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Apply 6.0.36 gameplay fix
        run: python3 tools/patch_family_636_ludo_turns.py

      - name: Validate gameplay behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 6036" duoapp/build.gradle
          grep -q "versionName '6.0.36'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.36"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.36'" duoapp/src/main/assets/index.html
          grep -q 'Чтобы вывести фишку из дома, нужна 6' duoapp/src/main/assets/index.html
          grep -q 'function ludoAnimateDie' duoapp/src/main/assets/index.html
          grep -q 'await ludoMove(legal\[0\])' duoapp/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          assert h.count('function renderLudo(){')==1
          assert h.count('function ludoRoll(){')==1
          assert h.count('function ludoAnimateDie(')==1
          assert 'animation:ludoRoll .86s' in h
          Path('/tmp/family636.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/family636.js
          node tools/test_ludo.cjs

      - name: Build unsigned 6.0.36 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify unsigned identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          "$AAPT" dump badging "$APK" > /tmp/badging636.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging636.txt
          grep -q "versionCode='6036'" /tmp/badging636.txt
          grep -q "versionName='6.0.36'" /tmp/badging636.txt

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Family Race turns and dice animation for 6.0.36'
            git push origin HEAD:fix/family-6.0.36-ludo-turns
          fi
