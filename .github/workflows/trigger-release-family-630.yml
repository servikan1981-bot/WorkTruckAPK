name: Trigger OurFamily 6.0.30 final release

on:
  push:
    branches: [family-630-game-fix]
    paths:
      - '.github/workflows/trigger-release-family-630.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-family-630-final.yml --repo "$GITHUB_REPOSITORY" --ref family-630-game-fix
