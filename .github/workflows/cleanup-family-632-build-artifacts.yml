name: Clean 6.0.32 build artifacts

on:
  push:
    branches: ['feature/family-6.0.32-voice-video']
    paths:
      - '.github/workflows/cleanup-family-632-build-artifacts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-6.0.32-voice-video
          fetch-depth: 0
      - name: Remove generated Gradle build output
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git rm -r -f duoapp/build
          git rm -f .github/workflows/cleanup-family-632-build-artifacts.yml
          git commit -m 'Remove generated 6.0.32 build artifacts'
          git push origin HEAD:feature/family-6.0.32-voice-video
