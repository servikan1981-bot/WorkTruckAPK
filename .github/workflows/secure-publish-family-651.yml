name: Build and publish OurFamily 6.0.51 Puzzle Performance — retry 2

on:
  push:
    branches: [ release/family-6.0.51-puzzle-performance ]
    paths:
      - '.github/workflows/secure-publish-family-651.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.51-puzzle-performance
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate 6.0.51 source
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.sergey.ourfamily'" duoapp/build.gradle
          grep -q "versionCode 6051" duoapp/build.gradle
          grep -q "versionName '6.0.51'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.51"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.51'" duoapp/src/main/assets/index.html
          grep -q '<script src="puzzles.js"></script>' duoapp/src/main/assets/index.html
          grep -q 'hubPuzzleBtn' duoapp/src/main/assets/puzzles.js
          grep -q 'design651-performance' duoapp/src/main/assets/index.html
          grep -q 'backdrop-filter:none!important' duoapp/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',h,re.S)
          assert blocks
          Path('/tmp/family651-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/family651-inline.js
          node --check duoapp/src/main/assets/puzzles.js
          for f in checkers.js durak.js billiards.js arkanoid.js; do node --check "duoapp/src/main/assets/$f"; done
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs

      - name: Generate one-time signing certificate
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily651.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily651.key -out /tmp/ourfamily651.crt -days 1 -subj '/CN=OurFamily-6.0.51-One-Time/'
          mkdir -p updates/candidates/signed651
          cp /tmp/ourfamily651.crt updates/candidates/signed651/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed651/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.51 signing certificate'
          git push origin HEAD:release/family-6.0.51-puzzle-performance

      - name: Wait for encrypted stable signing payload
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 180); do
            git fetch origin release/family-6.0.51-puzzle-performance
            OK=1
            for p in 0 1 2 3; do
              git cat-file -e "origin/release/family-6.0.51-puzzle-performance:updates/candidates/signed651/encrypted_payload.part${p}" 2>/dev/null || OK=0
            done
            if [ "$OK" = 1 ]; then
              : > /tmp/encrypted_payload.b64
              for p in 0 1 2 3; do git show "origin/release/family-6.0.51-puzzle-performance:updates/candidates/signed651/encrypted_payload.part${p}" >> /tmp/encrypted_payload.b64; done
              git reset --hard origin/release/family-6.0.51-puzzle-performance
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily651.crt -inkey /tmp/ourfamily651.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing651
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing651
          test -s /tmp/signing651/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing651/password.txt

      - name: Build and sign stable APK
        run: |
          set -euo pipefail
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_51_aligned.apk
          S=/tmp/OurFamily_6_0_51_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing651/password.txt)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$U" "$A"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$A" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/signing651/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$S" > /tmp/cert651.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$S" > /tmp/badging651.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging651.txt
          grep -q "versionCode='6051'" /tmp/badging651.txt
          grep -q "versionName='6.0.51'" /tmp/badging651.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert651.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert651.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert651.txt
          unzip -p "$S" assets/index.html | grep -q 'id="design651-performance"'
          unzip -p "$S" assets/puzzles.js | grep -q 'hubPuzzleBtn'
          unzip -p "$S" assets/index.html | grep -q 'puzzles.js'
          sha256sum "$S" | tee /tmp/651-sha256.txt

      - name: Publish update payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_51_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[x:x+16000] for x in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v651_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for n,c in enumerate(chunks):
              name=f'v651_{n:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={'versionCode':6051,'versionName':'6.0.51','apkBase64Parts':urls,'sha256':sha,'notes':'Оптимизация прокрутки главного экрана «Океан»: убран дорогой blur с прокручиваемых карточек и нижней панели, сокращена лишняя перерисовка домашнего экрана. Добавлена пятая игра «Пазлы» — лёгкий 15-пазл 3×3/4×4. Остальные игры, чаты, звонки, файлы и WebRTC не менялись.'}
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates/651.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_51_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY_651',len(apk),len(chunks),sha)
          PY
          rm -rf updates/candidates/signed651
          rm -f .github/workflows/secure-publish-family-651.yml
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates .github/workflows/secure-publish-family-651.yml
          git commit -m 'Release OurFamily 6.0.51 Puzzle Performance'
          git push origin HEAD:release/family-6.0.51-puzzle-performance
