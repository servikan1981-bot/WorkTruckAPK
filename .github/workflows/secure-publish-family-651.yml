name: Secure publish OurFamily 6.0.51

on:
  push:
    branches: ['release/family-6.0.51-publish']
    paths:
      - '.github/workflows/secure-publish-family-651.yml'
      - 'updates/downloads/OurFamily_6_0_51_Stable.apk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ourfamily-stable-6-publication

jobs:
  publish:
    if: github.ref == 'refs/heads/release/family-6.0.51-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_NAME: OurFamily_6_0_51_Stable.apk
      APK_SHA256: f71da5f1cd24fe973fdab6873fe309cde284b1728272dc1f8b0a146a0caa5db3
      STABLE_CERT_SHA256: 237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: updates/downloads/OurFamily_6_0_51_Stable.apk
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Verify the signed APK
        shell: bash
        run: |
          apk="updates/downloads/$APK_NAME"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          printf '%s  %s\n' "$APK_SHA256" "$apk" | sha256sum -c -
          "$tools/zipalign" -c 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cert651.txt"
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/cert651.txt"
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/cert651.txt"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/cert651.txt"
          grep -Fx "Signer #1 certificate SHA-256 digest: $STABLE_CERT_SHA256" "$RUNNER_TEMP/cert651.txt"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging651.txt"
          grep -E "^package: name='com\.sergey\.ourfamily' versionCode='6051' versionName='6\.0\.51'( |$)" "$RUNNER_TEMP/badging651.txt"

      - uses: actions/checkout@v5
        with:
          ref: family-stable-6
          path: stable

      - name: Prepare and verify the stable update
        working-directory: stable
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          name = os.environ["APK_NAME"]
          sha = os.environ["APK_SHA256"]
          apk = (Path(os.environ["GITHUB_WORKSPACE"]) / "updates" / "downloads" / name).read_bytes()
          latest = Path("updates/latest.json")
          current = json.loads(latest.read_text(encoding="utf-8"))
          if current["versionCode"] > 6051:
              raise SystemExit("A newer stable release is already public.")

          encoded = base64.b64encode(apk).decode("ascii")
          chunk_size = 16000
          payload = {
              f"v651_{offset // chunk_size:02d}.b64": encoded[offset:offset + chunk_size]
              for offset in range(0, len(encoded), chunk_size)
          }
          parts_url = (
              "https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/"
              "family-stable-6/updates/parts/"
          )
          manifest = {
              "versionCode": 6051,
              "versionName": "6.0.51",
              "apkBase64Parts": [parts_url + filename for filename in payload],
              "sha256": sha,
              "notes": "Тема «Океан», более плавная прокрутка главного экрана и новая игра «Пазлы» (3×3 и 4×4).",
          }
          if current["versionCode"] == 6051 and current != manifest:
              raise SystemExit("Version 6051 already has different release metadata.")

          parts = Path("updates/parts")
          parts.mkdir(parents=True, exist_ok=True)
          downloads = Path("updates/downloads")
          downloads.mkdir(parents=True, exist_ok=True)
          (downloads / name).write_bytes(apk)
          for filename, chunk in payload.items():
              (parts / filename).write_text(chunk, encoding="ascii")

          public_parts = [parts / url.rsplit("/", 1)[-1] for url in manifest["apkBase64Parts"]]
          rebuilt = base64.b64decode(
              "".join(part.read_text(encoding="ascii") for part in public_parts), validate=True
          )
          if rebuilt != apk or hashlib.sha256(rebuilt).hexdigest() != sha:
              raise SystemExit("The update parts do not reproduce the verified APK.")
          latest.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared {len(public_parts)} parts for {len(apk)} bytes, SHA-256 {sha}")
          PY

      - name: Publish APK and manifest in one commit
        working-directory: stable
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- updates/latest.json "updates/downloads/$APK_NAME" updates/parts/v651_*.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish OurFamily 6.0.51 stable update'
          git push origin HEAD:refs/heads/family-stable-6
