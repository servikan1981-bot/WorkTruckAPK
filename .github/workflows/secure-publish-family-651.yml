name: Secure publish OurFamily 6.0.51

on:
  push:
    branches: ['release/family-6.0.51-publish']
    paths:
      - '.github/workflows/secure-publish-family-651.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.51-publish
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate 6.0.51 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.sergey.ourfamily'" duoapp/build.gradle
          grep -q "versionCode 6051" duoapp/build.gradle
          grep -q "versionName '6.0.51'" duoapp/build.gradle
          test -s duoapp/src/main/assets/puzzles.js
          grep -q "APP_VERSION='6.0.51'" duoapp/src/main/assets/index.html
          grep -q 'Пазлы' duoapp/src/main/assets/puzzles.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks
          Path('/tmp/family651-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/family651-inline.js
          node --check duoapp/src/main/assets/puzzles.js

      - name: Build unsigned 6.0.51 candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging.txt
          grep -q "versionCode='6051'" /tmp/badging.txt
          grep -q "versionName='6.0.51'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q "APP_VERSION='6.0.51'"
          unzip -p "$APK" assets/puzzles.js | grep -q 'Пазлы'
          mkdir -p updates/candidates/unsigned651
          python3 - <<'PY'
          from pathlib import Path
          import base64
          apk=Path('duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk').read_bytes()
          b64=base64.b64encode(apk).decode('ascii')
          parts=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          out=Path('updates/candidates/unsigned651')
          for p in out.glob('part_*.b64'): p.unlink()
          for i,c in enumerate(parts):
              (out/f'part_{i:02d}.b64').write_text(c,encoding='ascii')
          print('unsigned bytes',len(apk),'parts',len(parts))
          PY

      - name: Upload unsigned 6.0.51 candidate
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_51_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error

      - name: Create one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily651-ephemeral.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily651-ephemeral.key             -out /tmp/ourfamily651-ephemeral.crt -days 1 -subj '/CN=OurFamily-6.0.51-One-Time/'
          mkdir -p updates/candidates/signed651
          cp /tmp/ourfamily651-ephemeral.crt updates/candidates/signed651/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/unsigned651 updates/candidates/signed651/ephemeral_cert.pem
          git commit -m 'Prepare OurFamily 6.0.51 signing candidate'
          git push origin HEAD:release/family-6.0.51-publish

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 180); do
            git fetch origin release/family-6.0.51-publish
            OK=1
            for p in 00 01 02 03 04 05 06; do
              git cat-file -e "origin/release/family-6.0.51-publish:updates/candidates/signed651/encrypted_payload.part_$p" 2>/dev/null || OK=0
            done
            if [ "$OK" = 1 ]; then
              : > /tmp/encrypted_payload.b64
              for p in 00 01 02 03 04 05 06; do
                git show "origin/release/family-6.0.51-publish:updates/candidates/signed651/encrypted_payload.part_$p" >> /tmp/encrypted_payload.b64
              done
              git reset --hard origin/release/family-6.0.51-publish
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1

      - name: Decrypt signing material
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER             -in /tmp/signing_payload.cms             -recip /tmp/ourfamily651-ephemeral.crt             -inkey /tmp/ourfamily651-ephemeral.key             -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing651
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing651
          test -s /tmp/signing651/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing651/password.txt

      - name: Sign exact 6.0.51 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re,hashlib
          parts=sorted(Path('updates/candidates/unsigned651').glob('part_*.b64'))
          assert parts
          raw=''.join(re.sub(r'\s+','',p.read_text(encoding='ascii')) for p in parts)
          apk=base64.b64decode(raw,validate=True)
          Path('/tmp/OurFamily_6_0_51_unsigned.apk').write_bytes(apk)
          print('unsigned',len(apk),hashlib.sha256(apk).hexdigest())
          PY
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PASS=$(tr -d '\r\n' < /tmp/signing651/password.txt)
          "$BT/zipalign" -p -f 4 /tmp/OurFamily_6_0_51_unsigned.apk /tmp/OurFamily_6_0_51_aligned.apk
          "$BT/zipalign" -c -v 4 /tmp/OurFamily_6_0_51_aligned.apk >/dev/null
          "$BT/apksigner" sign             --ks /tmp/signing651/OurFamily_Stable6_Signing.p12 --ks-type PKCS12             --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true             --out /tmp/OurFamily_6_0_51_Stable.apk /tmp/OurFamily_6_0_51_aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_51_Stable.apk > /tmp/cert651.txt
          "$BT/aapt" dump badging /tmp/OurFamily_6_0_51_Stable.apk > /tmp/badging651.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging651.txt
          grep -q "versionCode='6051'" /tmp/badging651.txt
          grep -q "versionName='6.0.51'" /tmp/badging651.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert651.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert651.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert651.txt

      - name: Build update payload and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_51_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v651_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for n,c in enumerate(chunks):
              name=f'v651_{n:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6051,
            'versionName':'6.0.51',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Тема «Океан», оптимизация скролла главного экрана и новая игра «Пазлы» (3×3/4×4). Остальной функционал сохранён.'
          }
          Path('updates/candidates/651.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('updates/latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_51_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY_651',len(apk),len(chunks),sha)
          PY

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf updates/candidates/signed651 updates/candidates/unsigned651
          rm -f .github/workflows/secure-publish-family-651.yml
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates .github/workflows/secure-publish-family-651.yml
          git commit -m 'Release OurFamily 6.0.51 stable'
          git push origin HEAD:release/family-6.0.51-publish
          git push origin HEAD:family-stable-6
