name: Release OurFamily 6.0.20 Final

on:
  push:
    branches: [ family-stable-6 ]
    paths:
      - '.github/workflows/release-family-620-final.yml'
      - 'tools/game_family_620.py'
      - 'updates/candidates/sign620.patch.b64'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-33 build-tools;35.0.0 emulator system-images;android-33;google_apis;x86_64'

      - name: Download exact validated fixed 6.0.20 unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: OurFamily_6_0_20_unsigned
          path: /tmp/family620unsigned
          github-token: ${{ github.token }}
          run-id: 36308209674

      - name: Verify exact unsigned base and restore Stable-signed 6.0.20
        run: |
          APK=$(find /tmp/family620unsigned -type f -name '*.apk' | head -1)
          test -n "$APK"
          echo '3192e325f6e966a9461a0178e80e206df8caeecacd6db0458c8739a8dd0a3b31  '"$APK" | sha256sum -c -
          base64 -d updates/candidates/sign620.patch.b64 > /tmp/sign620.patch.zst
          zstd -q -d --patch-from="$APK" /tmp/sign620.patch.zst -o /tmp/OurFamily_6_0_20_Stable.apk
          echo '66a8a2afbbe00e8a92574ab0f484145a62eb518a103517fe9051d99077c8346a  /tmp/OurFamily_6_0_20_Stable.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 /tmp/OurFamily_6_0_20_Stable.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_20_Stable.apk | tee /tmp/620-certs.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/OurFamily_6_0_20_Stable.apk | tee /tmp/620-badging.txt
          grep -q "package: name='com.sergey.ourfamily' versionCode='6020' versionName='6.0.20'" /tmp/620-badging.txt
          grep -q '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83' /tmp/620-certs.txt
          unzip -p /tmp/OurFamily_6_0_20_Stable.apk assets/index.html | grep -q "Наша семья · v6.0.20"
          unzip -p /tmp/OurFamily_6_0_20_Stable.apk assets/index.html | grep -q "Подкидной · 36 карт · 1 на 1"
          unzip -p /tmp/OurFamily_6_0_20_Stable.apk classes.dex | strings | grep -q 'family.familysergey.netcraze.pro'
          unzip -p /tmp/OurFamily_6_0_20_Stable.apk classes.dex | strings | grep -q 'durak.js'

      - name: Prepare candidate update files
        run: |
          base64 -w0 /tmp/OurFamily_6_0_20_Stable.apk > /tmp/family620.b64
          rm -f updates/parts/v620_*.b64
          split -b 16000 -d -a 2 --additional-suffix=.b64 /tmp/family620.b64 updates/parts/v620_
          python3 - <<'PY'
          import json, pathlib, base64, hashlib
          parts=sorted(pathlib.Path('updates/parts').glob('v620_*.b64'))
          meta={
            'versionCode':6020,
            'versionName':'6.0.20',
            'apkBase64Parts':['https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'+p.name for p in parts],
            'sha256':'66a8a2afbbe00e8a92574ab0f484145a62eb518a103517fe9051d99077c8346a',
            'notes':'Дурак, шашки, нижнее меню и статусы. Исправлена загрузка правил Дурака и работа игр через домашний сервер: приглашения и ходы не блокируют экран при медленном ответе туннеля. Проверено обновление 6.0.19 → 6.0.20 на двух телефонах.'
          }
          pathlib.Path('updates/candidates/620.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          raw=''.join(p.read_text().strip() for p in parts)
          data=base64.b64decode(raw)
          assert hashlib.sha256(data).hexdigest()==meta['sha256']
          print('Candidate parts:',len(parts),'bytes:',len(data))
          PY

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Final 6.0.19 to 6.0.20 two-phone Durak test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/game_family_620.sh

      - name: Publish 6.0.20 to all phones
        run: |
          cp updates/candidates/620.json updates/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/candidates/620.json updates/parts/v620_*.b64
          git add -u updates/parts
          git commit -m 'Publish OurFamily 6.0.20 stable'
          git push origin HEAD:family-stable-6

      - name: Upload final Stable APK
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_20_Stable
          path: /tmp/OurFamily_6_0_20_Stable.apk
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: family-620-final-diagnostics
          path: |
            /tmp/emulator-5554-game.png
            /tmp/emulator-5556-game.png
            /tmp/emulator-5554-game.xml
            /tmp/emulator-5556-game.xml
            /tmp/emulator-5554-logcat.txt
            /tmp/emulator-5556-logcat.txt
            /tmp/620-certs.txt
            /tmp/620-badging.txt
          if-no-files-found: ignore
