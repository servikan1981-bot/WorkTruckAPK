name: Build Our Family v5.6.1

on:
  workflow_dispatch:
  push:
    branches: [ family-v5-6-1-release-fix ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-v561.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks, 'No JS script block'
          Path('/tmp/family-v561.js').write_text('\n'.join(blocks))
          assert "APP_VERSION='5.6.1'" in h
          assert 'Наша семья v5.6.1' in h
          assert 'async function sendPresence()' not in h
          assert 'presenceTimer' not in h
          PY
          node --check /tmp/family-v561.js

      - name: Validate core messaging
        run: |
          H=duoapp/src/main/assets/index.html
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          for token in direct_chat group_chat receipt_read handleNativeAck sendReaction REACTIONS scrollChatToBottom openPhotoViewer consumeNativeNavigation tryOpenPendingMessage familyPresenceTopic openAdminArchiveScreen; do
            grep -q "$token" "$H"
          done
          grep -q "sendNativeDelivered" "$S"
          grep -q "startPresenceWorker" "$S"
          grep -q "START_STICKY" "$S"
          grep -q "RelayInbox.enqueue" "$S"

      - name: Validate calls media and news
        run: |
          H=duoapp/src/main/assets/index.html
          N=duoapp/src/main/java/com/sergey/duochat/PositiveNewsFetcher.java
          for token in direct_invite direct_offer direct_answer direct_candidate group_invite group_join group_offer group_answer group_candidate switchCamera enableSelfDrag startRingback speakerBtn "Семейные новости" "layout-side" "layout-stack" "layout-pip"; do
            grep -q "$token" "$H"
          done
          grep -q "positive_news_v56_ru" "$N"
          grep -q "looksRussian" "$N"
          if grep -q "goodnewsnetwork.org" "$N"; then exit 1; fi
          if grep -q "positive.news/feed" "$N"; then exit 1; fi

      - name: Validate Android manifest and background service
        run: |
          M=duoapp/src/main/AndroidManifest.xml
          J=duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q 'android:label="Наша семья v5.6.1"' "$M"
          grep -q 'android:stopWithTask="false"' "$M"
          grep -q "RECEIVE_BOOT_COMPLETED" "$M"
          grep -q "BootReceiver" "$M"
          grep -q 'return "5.6.1";' "$J"

      - name: Build APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug

      - name: Verify APK structure and assets
        run: |
          APK=duoapp/build/outputs/apk/debug/duoapp-debug.apk
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "Наша семья v5.6.1"
          unzip -p "$APK" assets/index.html | grep -q "consumeNativeNavigation"
          unzip -p "$APK" assets/index.html | grep -q "sendReaction"
          unzip -p "$APK" assets/index.html | grep -q "openPhotoViewer"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Rename APK
        run: cp duoapp/build/outputs/apk/debug/duoapp-debug.apk OurFamily_v5_6_1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_v5_6_1
          path: OurFamily_v5_6_1.apk
          if-no-files-found: error
