name: Build OurFamily 6.0.21

on:
  push:
    branches: [ family-621-work, family-stable-6 ]
    paths:
      - 'duoapp/**'
      - 'tools/fix_family_620_network.py'
      - 'tools/fix_family_621.py'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-621.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply stable 6.0.20 fixes
        run: python3 tools/fix_family_620_network.py

      - name: Apply 6.0.21 video and urgent-message update
        run: python3 tools/fix_family_621.py

      - name: Validate 6.0.21 identity and urgent broadcast
        run: |
          grep -q "versionCode 6021" duoapp/build.gradle
          grep -q "versionName '6.0.21'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.21"' duoapp/src/main/AndroidManifest.xml
          grep -q 'UrgentMessageActivity' duoapp/src/main/AndroidManifest.xml
          grep -q 'class UrgentMessageActivity' duoapp/src/main/java/com/sergey/duochat/UrgentMessageActivity.java
          grep -q 'sendUrgentToAll' duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          grep -q 'of5urgent' duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          grep -q 'urgentToken' duoapp/src/main/java/com/sergey/duochat/FamilyDirectory.java
          grep -q 'urgentMenuBtn' duoapp/src/main/assets/index.html
          grep -q 'Срочное сообщение всем' duoapp/src/main/assets/index.html
          grep -q "role!=='sergey'" duoapp/src/main/assets/index.html

      - name: Validate direct-video hardening
        run: |
          H=duoapp/src/main/assets/index.html
          grep -q 'stun2.l.google.com:19302' "$H"
          grep -q 'stun3.l.google.com:19302' "$H"
          grep -q 'maxBitrate=650000' "$H"
          grep -q 'maxFramerate=20' "$H"
          grep -q 'recoveryTimer' "$H"
          grep -q 'ps.restart<2' "$H"
          grep -q 'setTimeout(sendInvite,7000)' "$H"
          grep -q 'width:{ideal:640,max:960}' "$H"

      - name: Validate JavaScript and retained functionality
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert blocks
          Path('/tmp/family621.js').write_text('\n'.join(blocks))
          for token in [
            "APP_VERSION='6.0.21'", 'direct_chat', 'group_chat', 'receipt_read',
            'openPhotoViewer', 'familyPresenceTopic', 'startRingback', 'speakerBtn',
            'Дурак', 'Шашки', 'Семейные новости', 'sendUrgentAll', 'urgentMenuBtn'
          ]:
              assert token in h, token
          PY
          node --check /tmp/family621.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs

      - name: Validate native code markers
        run: |
          M=duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          U=duoapp/src/main/java/com/sergey/duochat/UrgentMessageActivity.java
          grep -q 'String\[\] gameRuleAssets = {"checkers.js", "durak.js"}' "$M"
          grep -q 'SIGNAL_POSTER.execute' "$M"
          grep -q 'urgent_active_id' "$S"
          grep -q 'urgent_dismissed_id' "$U"
          grep -q 'setFullScreenIntent(pi, true)' "$U"
          grep -q 'showPendingIfNeeded' "$M"

      - name: Build unsigned 6.0.21
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify unsigned APK
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "APP_VERSION='6.0.21'"
          unzip -p "$APK" assets/index.html | grep -q 'Срочное сообщение всем'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='6021'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='6.0.21'"
          sha256sum "$APK" | tee /tmp/unsigned621.sha256
          ls -lh "$APK"

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_21_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error

      - name: Export unsigned APK as text parts for release signing
        if: github.ref_name == 'family-621-work'
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          rm -rf updates/candidates/621-unsigned-parts
          mkdir -p updates/candidates/621-unsigned-parts
          base64 -w0 "$APK" > /tmp/621unsigned.b64
          split -b 16000 -d -a 2 --additional-suffix=.b64 /tmp/621unsigned.b64 updates/candidates/621-unsigned-parts/u621_
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path('duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk').read_bytes()
          parts=sorted(pathlib.Path('updates/candidates/621-unsigned-parts').glob('u621_*.b64'))
          meta={'sha256':hashlib.sha256(apk).hexdigest(),'size':len(apk),'parts':[p.name for p in parts]}
          pathlib.Path('updates/candidates/621-unsigned.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(meta)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/candidates/621-unsigned.json updates/candidates/621-unsigned-parts
          git commit -m 'Export unsigned OurFamily 6.0.21 candidate' || exit 0
          git push origin HEAD:family-621-work
