name: Export Android Signing Tools

on:
  workflow_dispatch:
  push:
    branches: [ family-stable-6 ]
    paths:
      - '.github/workflows/export-android-signing-tools.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Package signing tools
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/
          cp "$BT/zipalign" signing-tools/
          cp "$BT/aapt" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          if [ -d "$BT/lib64" ]; then cp -a "$BT/lib64" signing-tools/; fi
          chmod +x signing-tools/apksigner signing-tools/zipalign signing-tools/aapt
          ls -lh signing-tools signing-tools/lib
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: signing-tools
          if-no-files-found: error
