name: Verify signed 6.0.30 upgrade

on:
  push:
    branches: [ family-630-game-fix ]
    paths:
      - '.github/workflows/test-family-630-stable-signed.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Reconstruct real stable APKs and verify signers
        run: |
          git fetch origin family-stable-6:refs/remotes/origin/family-stable-6
          : > /tmp/v629.b64
          : > /tmp/v630.b64
          for i in $(seq -w 0 9); do
            git show origin/family-stable-6:updates/parts/v629_${i}.b64 >> /tmp/v629.b64
            git show origin/family-stable-6:updates/parts/v630_${i}.b64 >> /tmp/v630.b64
          done
          tr -d '\r\n ' < /tmp/v629.b64 | base64 -d > /tmp/OurFamily_6_0_29.apk
          tr -d '\r\n ' < /tmp/v630.b64 | base64 -d > /tmp/OurFamily_6_0_30.apk
          sha256sum /tmp/OurFamily_6_0_29.apk /tmp/OurFamily_6_0_30.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_29.apk > /tmp/cert629.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_30.apk > /tmp/cert630.txt
          C629=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert629.txt | awk '{print $NF}')
          C630=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert630.txt | awk '{print $NF}')
          echo "629=$C629"
          echo "630=$C630"
          test -n "$C629"
          test "$C629" = "$C630"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/OurFamily_6_0_30.apk | grep "package: name='com.sergey.ourfamily' versionCode='6030' versionName='6.0.30'"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade real signed 6.0.29 to 6.0.30 on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install /tmp/OurFamily_6_0_29.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m1 'versionCode=6029'
            adb shell am start -W -n com.sergey.ourfamily/com.sergey.duochat.MainActivity
            sleep 2
            adb install -r /tmp/OurFamily_6_0_30.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m1 'versionCode=6030'
            adb shell am force-stop com.sergey.ourfamily
            adb shell am start -W -n com.sergey.ourfamily/com.sergey.duochat.MainActivity
            sleep 4
            adb shell pidof com.sergey.ourfamily | tee /tmp/pid630.txt
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|Process: com\.sergey\.ourfamily' > /tmp/fatal630.txt || true
            grep -q '[0-9]' /tmp/pid630.txt
            test ! -s /tmp/fatal630.txt
