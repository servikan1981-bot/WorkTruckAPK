name: OurFamily 6.0.15 recovery on Android 13 and 15
on:
  push:
    branches: [family-stable-6]
    paths:
      - 'updates/candidates/615.json'
      - 'updates/parts/v615_*.b64'
      - 'tools/recovery_family_615.sh'
      - '.github/workflows/recovery-family-615.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate signatures and alignment
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          m=json.loads(pathlib.Path('updates/candidates/615.json').read_text())
          assert m['versionCode']==6015
          data=base64.b64decode(''.join((pathlib.Path('updates/parts')/u.rsplit('/',1)[-1]).read_text() for u in m['apkBase64Parts']))
          assert hashlib.sha256(data).hexdigest()==m['sha256']
          pathlib.Path('/tmp/family-615.apk').write_bytes(data)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 /tmp/family-615.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/family-615.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update 6.0.14 to 6.0.15 with family profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/recovery_family_615.sh
        env:
          FAMILY_API_LEVEL: ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-quote-upgrade-api-${{ matrix.api-level }}
          path: |
            /tmp/family-615-crash.log
            /tmp/family-615-denied.png
            /tmp/family-615-denied-logcat.txt
            /tmp/family-615.xml
            /tmp/family-615-menu.xml
            /tmp/family-615.png
            /tmp/family-615-logcat.txt
          if-no-files-found: ignore
