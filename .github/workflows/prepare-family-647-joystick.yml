name: Prepare OurFamily 6.0.47 Arkanoid joystick

on:
  push:
    branches:
      - release/family-6.0.47-arkanoid-joystick
    paths:
      - .github/workflows/prepare-family-647-joystick.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.47-arkanoid-joystick
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Apply Arkanoid joystick patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Version 6.0.47
          replacements = {
              'duoapp/build.gradle': [('versionCode 6046','versionCode 6047'), ("versionName '6.0.46'","versionName '6.0.47'")],
              'duoapp/src/main/AndroidManifest.xml': [('Наша семья 6.0.46','Наша семья 6.0.47')],
              'duoapp/src/main/assets/index.html': [('6.0.46','6.0.47')],
          }
          for name,pairs in replacements.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing version marker {old!r} in {name}')
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          p=Path('duoapp/src/main/assets/arkanoid.js')
          text=p.read_text(encoding='utf-8')

          old="var state={level:1,score:0,lives:3,high:0,running:false,paused:false,started:false,fullscreen:false,lastTs:0,raf:0,paddle:null,balls:[],bricks:[],bonuses:[],particles:[],wideUntil:0,message:'',messageUntil:0};"
          new="var state={level:1,score:0,lives:3,high:0,running:false,paused:false,started:false,fullscreen:false,lastTs:0,raf:0,paddle:null,balls:[],bricks:[],bonuses:[],particles:[],wideUntil:0,message:'',messageUntil:0,joyAxis:0,joyPointer:null};"
          if old not in text: raise SystemExit('state marker missing')
          text=text.replace(old,new,1)

          style_marker="';doc.head.appendChild(s);"
          if style_marker not in text: raise SystemExit('style marker missing')
          extra_css="""\\
.ark-stage{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:960px;margin:0 auto;min-height:0}\\
.ark-joystick{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto}.ark-joystick-title{font-size:11px;font-weight:900;letter-spacing:.08em;color:#91a8dc;white-space:nowrap}.ark-joystick-track{position:relative;width:min(72vw,520px);height:58px;border-radius:30px;border:1px solid rgba(123,157,255,.48);background:linear-gradient(180deg,rgba(25,47,99,.92),rgba(8,18,48,.96));box-shadow:inset 0 4px 15px rgba(0,0,0,.38),0 6px 18px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}.ark-joystick-track:before{content:'◀';position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:20px;color:#89a8ff}.ark-joystick-track:after{content:'▶';position:absolute;right:17px;top:50%;transform:translateY(-50%);font-size:20px;color:#89a8ff}.ark-joystick-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 28%,#e9f4ff 0,#75bcff 28%,#326df2 63%,#17317e 100%);border:2px solid rgba(255,255,255,.72);box-shadow:0 5px 18px rgba(19,77,220,.55),inset 0 2px 5px rgba(255,255,255,.5);pointer-events:none;transition:left .08s ease}.ark-joystick.active .ark-joystick-knob{transition:none;box-shadow:0 4px 22px rgba(80,145,255,.8),inset 0 2px 5px rgba(255,255,255,.5)}\\
.arkanoid-fullscreen-mode .ark-stage{flex:1;flex-direction:row;justify-content:center;align-items:center;gap:8px;max-width:100vw}.arkanoid-fullscreen-mode .ark-shell{width:min(calc(100vw - 142px),calc((100vh - 92px) * 16 / 9));max-width:calc(100vw - 142px);max-height:calc(100vh - 92px);flex:0 1 auto}.arkanoid-fullscreen-mode .ark-joystick{width:126px;height:126px;flex:0 0 126px;flex-direction:column;gap:4px}.arkanoid-fullscreen-mode .ark-joystick-title{font-size:10px}.arkanoid-fullscreen-mode .ark-joystick-track{width:112px;height:112px;border-radius:56px}.arkanoid-fullscreen-mode .ark-joystick-track:before{left:9px;font-size:17px}.arkanoid-fullscreen-mode .ark-joystick-track:after{right:9px;font-size:17px}.arkanoid-fullscreen-mode .ark-joystick-knob{width:52px;height:52px}\\
@media(max-width:520px){.ark-body{gap:6px}.ark-hud{gap:4px}.ark-stat{padding:5px 4px;font-size:11px}.ark-stat strong{font-size:16px}.ark-joystick{gap:5px}.ark-joystick-title{font-size:9px}.ark-joystick-track{height:54px;width:min(76vw,390px)}.ark-joystick-knob{width:46px;height:46px}.ark-controls button{padding:9px 5px;font-size:12px}}\\
"""
          text=text.replace(style_marker,extra_css+style_marker,1)

          shell_line=' <div class=\\"ark-shell\\"><canvas id=\\"arkCanvas\\" width=\\"960\\" height=\\"540\\" aria-label=\\"Арканоид\\"></canvas><div id=\\"arkOverlay\\" class=\\"ark-overlay\\"><span>Нажмите «Старт»</span></div></div>\\\\\n'
          stage_line=' <div class=\\"ark-stage\\"><div class=\\"ark-shell\\"><canvas id=\\"arkCanvas\\" width=\\"960\\" height=\\"540\\" aria-label=\\"Арканоид\\"></canvas><div id=\\"arkOverlay\\" class=\\"ark-overlay\\"><span>Нажмите «Старт»</span></div></div><div id=\\"arkJoystick\\" class=\\"ark-joystick\\"><span class=\\"ark-joystick-title\\">УПРАВЛЕНИЕ</span><div id=\\"arkJoystickTrack\\" class=\\"ark-joystick-track\\" role=\\"slider\\" aria-label=\\"Управление платформой\\" aria-valuemin=\\"-100\\" aria-valuemax=\\"100\\" aria-valuenow=\\"0\\"><div id=\\"arkJoystickKnob\\" class=\\"ark-joystick-knob\\"></div></div></div></div>\\\\\n'
          if shell_line not in text: raise SystemExit('ark shell HTML marker missing')
          text=text.replace(shell_line,stage_line,1)

          old_hint=' <div class=\\"ark-hint\\">Ведите пальцем по игровому полю, чтобы двигать платформу. Коснитесь поля, чтобы запустить шар.</div>\\\\\n'
          new_hint=' <div class=\\"ark-hint\\">Управляйте платформой джойстиком. Игровое поле остаётся свободным; коснитесь его только для запуска шара.</div>\\\\\n'
          if old_hint not in text: raise SystemExit('hint marker missing')
          text=text.replace(old_hint,new_hint,1)

          old_canvas=""" if(canvas){
  canvas.addEventListener('pointerdown',function(e){unlockAudio();movePaddle(e);if(state.started&&state.balls.some(function(b){return b.stuck;}))launchStuckBalls();try{canvas.setPointerCapture(e.pointerId);}catch(_e){};});
  canvas.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch'||e.pointerType==='pen')movePaddle(e);});
 }
"""
          new_canvas=""" if(canvas){
  canvas.addEventListener('pointerdown',function(){unlockAudio();if(state.started&&state.balls.some(function(b){return b.stuck;}))launchStuckBalls();});
 }
 bindJoystick();
"""
          if old_canvas not in text: raise SystemExit('canvas control marker missing')
          text=text.replace(old_canvas,new_canvas,1)

          move_line="function movePaddle(e){if(!canvas||!state.paddle)return;var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)/Math.max(1,r.width)*W;state.paddle.x=clamp(x-state.paddle.w/2,8,W-state.paddle.w-8);state.balls.forEach(function(b){if(b.stuck)b.x=state.paddle.x+state.paddle.w/2;});if(!state.running)draw();}\n"
          joy_code="""function joystickAxisFromClientX(clientX,left,width){var raw=((clientX-left)/Math.max(1,width)-.5)*2;raw=clamp(raw,-1,1);var a=Math.abs(raw);if(a<.08)return 0;return Math.sign(raw)*((a-.08)/.92);}
function syncStuckBalls(){if(!state.paddle)return;state.balls.forEach(function(b){if(b.stuck)b.x=state.paddle.x+state.paddle.w/2;});}
function updateJoystickVisual(){if(!doc)return;var knob=doc.getElementById('arkJoystickKnob'),track=doc.getElementById('arkJoystickTrack');if(knob)knob.style.left=(50+state.joyAxis*31)+'%';if(track)track.setAttribute('aria-valuenow',String(Math.round(state.joyAxis*100)));}
function resetJoystick(){state.joyAxis=0;state.joyPointer=null;if(doc){var box=doc.getElementById('arkJoystick');if(box)box.classList.remove('active');}updateJoystickVisual();}
function bindJoystick(){if(!doc)return;var track=doc.getElementById('arkJoystickTrack');if(!track||track.dataset.bound==='1')return;track.dataset.bound='1';function apply(e){var r=track.getBoundingClientRect();state.joyAxis=joystickAxisFromClientX(e.clientX,r.left,r.width);updateJoystickVisual();}function end(e){if(state.joyPointer!==null&&e&&e.pointerId!==state.joyPointer)return;resetJoystick();}track.addEventListener('pointerdown',function(e){unlockAudio();state.joyPointer=e.pointerId;var box=doc.getElementById('arkJoystick');if(box)box.classList.add('active');try{track.setPointerCapture(e.pointerId);}catch(_e){}apply(e);e.preventDefault();});track.addEventListener('pointermove',function(e){if(state.joyPointer===e.pointerId){apply(e);e.preventDefault();}});track.addEventListener('pointerup',end);track.addEventListener('pointercancel',end);track.addEventListener('lostpointercapture',function(){resetJoystick();});updateJoystickVisual();}
"""
          if move_line not in text: raise SystemExit('movePaddle marker missing')
          text=text.replace(move_line,joy_code,1)

          update_marker=" var p=state.paddle;\n"
          update_new=" var p=state.paddle;if(p&&Math.abs(state.joyAxis)>.001){var paddleSpeed=820;p.x=clamp(p.x+state.joyAxis*paddleSpeed*dt,8,W-p.w-8);syncStuckBalls();}\n"
          if update_marker not in text: raise SystemExit('update paddle marker missing')
          text=text.replace(update_marker,update_new,1)

          full_old=" setTimeout(draw,220);\n}"
          full_new=" resetJoystick();setTimeout(function(){updateJoystickVisual();draw();},220);\n}"
          if full_old not in text: raise SystemExit('fullscreen marker missing')
          text=text.replace(full_old,full_new,1)

          export_old="root.ArkanoidGame={speedForLevel:speedForLevel,brickRowsForLevel:brickRowsForLevel,buildLevel:buildLevel,open:openGame,newGame:newGame};"
          export_new="root.ArkanoidGame={speedForLevel:speedForLevel,brickRowsForLevel:brickRowsForLevel,buildLevel:buildLevel,joystickAxisFromClientX:joystickAxisFromClientX,open:openGame,newGame:newGame};"
          if export_old not in text: raise SystemExit('export marker missing')
          text=text.replace(export_old,export_new,1)

          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate joystick source
        shell: bash
        run: |
          set -euo pipefail
          H=duoapp/src/main/assets/index.html
          A=duoapp/src/main/assets/arkanoid.js
          grep -q 'versionCode 6047' duoapp/build.gradle
          grep -q "versionName '6.0.47'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.47"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.47'" "$H"
          grep -q 'id=\\"arkJoystickTrack\\"' "$A"
          grep -q 'function joystickAxisFromClientX' "$A"
          grep -q 'paddleSpeed=820' "$A"
          grep -q 'bindJoystick();' "$A"
          grep -q 'Управляйте платформой джойстиком' "$A"
          ! grep -q 'pointerdown.*movePaddle' "$A"
          node --check "$A"
          node --check duoapp/src/main/assets/billiards.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs
          node - <<'NODE'
          require('./duoapp/src/main/assets/arkanoid.js');
          const a=global.ArkanoidGame;
          if(!a||typeof a.joystickAxisFromClientX!=='function') throw new Error('joystick API missing');
          const f=a.joystickAxisFromClientX;
          if(Math.abs(f(50,0,100))>0.001) throw new Error('joystick center must be zero');
          if(f(0,0,100)>-0.99||f(100,0,100)<0.99) throw new Error('joystick full travel invalid');
          if(Math.abs(f(53,0,100))>0.001) throw new Error('joystick deadzone invalid');
          if(!(f(75,0,100)>0.35&&f(75,0,100)<0.6)) throw new Error('joystick proportional range invalid');
          console.log('ARKANOID_JOYSTICK_OK',f(0,0,100),f(50,0,100),f(75,0,100),f(100,0,100));
          NODE

      - name: Verify video implementation untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin family-stable-6
          test -z "$(git diff --name-only origin/family-stable-6 -- duoapp/src/main/java/com/sergey/duochat/MainActivity.java)"
          grep -q 'RTCPeerConnection' duoapp/src/main/assets/index.html
          grep -q 'prepareLocalMedia' duoapp/src/main/assets/index.html

      - name: Build and inspect APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='6047'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='6.0.47'"

      - name: Commit validated joystick release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html duoapp/src/main/assets/arkanoid.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add Arkanoid joystick controls for 6.0.47'
            git push origin HEAD:release/family-6.0.47-arkanoid-joystick
          fi
