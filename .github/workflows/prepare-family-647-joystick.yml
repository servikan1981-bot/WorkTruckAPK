name: Prepare OurFamily 6.0.47 joystick

on:
  push:
    branches:
      - release/family-6.0.47-arkanoid-joystick
    paths:
      - .github/workflows/prepare-family-647-joystick.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.47-arkanoid-joystick
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Apply patch
        run: python3 tools/patch_family_647_joystick.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 6047' duoapp/build.gradle
          grep -q "versionName '6.0.47'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.47"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.47'" duoapp/src/main/assets/index.html
          grep -q 'arkJoystickTrack' duoapp/src/main/assets/arkanoid.js
          grep -q 'paddleSpeed=820' duoapp/src/main/assets/arkanoid.js
          grep -q 'Управляйте платформой джойстиком' duoapp/src/main/assets/arkanoid.js
          node --check duoapp/src/main/assets/arkanoid.js
          node --check duoapp/src/main/assets/billiards.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
      - name: Run regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_arkanoid_joystick_647.cjs
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs
      - name: Verify video untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin family-stable-6
          test -z "$(git diff --name-only origin/family-stable-6 -- duoapp/src/main/java/com/sergey/duochat/MainActivity.java)"
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='6047'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='6.0.47'"
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html duoapp/src/main/assets/arkanoid.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add Arkanoid joystick controls for 6.0.47'
            git push origin HEAD:release/family-6.0.47-arkanoid-joystick
          fi

# rerun-marker: robust-stage-replacement
