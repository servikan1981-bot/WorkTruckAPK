name: Prepare OurFamily 6.0.47 Arkanoid joystick

on:
  push:
    branches:
      - release/family-6.0.47-joystick
    paths:
      - duoapp/src/main/assets/arkanoid_joystick.js
      - .github/workflows/prepare-family-647-joystick.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.47-joystick
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Apply 6.0.47 version and joystick wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          reps={
            'duoapp/build.gradle':[('versionCode 6046','versionCode 6047'),("versionName '6.0.46'","versionName '6.0.47'")],
            'duoapp/src/main/AndroidManifest.xml':[('Наша семья 6.0.46','Наша семья 6.0.47')],
            'duoapp/src/main/assets/index.html':[('6.0.46','6.0.47')],
          }
          for name,pairs in reps.items():
            p=Path(name); t=p.read_text(encoding='utf-8')
            for old,new in pairs:
              if old not in t: raise SystemExit(f'missing {old} in {name}')
              t=t.replace(old,new)
            p.write_text(t,encoding='utf-8')
          p=Path('duoapp/src/main/assets/index.html');t=p.read_text(encoding='utf-8')
          marker='<script src="arkanoid_joystick.js"></script>'
          if marker not in t:
            anchor='<script src="arkanoid.js"></script>'
            if anchor not in t: raise SystemExit('arkanoid script anchor missing')
            t=t.replace(anchor,anchor+'\n'+marker,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Validate source and joystick UX
        shell: bash
        run: |
          set -euo pipefail
          H=duoapp/src/main/assets/index.html
          J=duoapp/src/main/assets/arkanoid_joystick.js
          grep -q 'versionCode 6047' duoapp/build.gradle
          grep -q "versionName '6.0.47'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.47"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.47'" "$H"
          grep -q '<script src="arkanoid_joystick.js"></script>' "$H"
          grep -q 'id=.arkJoyDock' "$J"
          grep -q 'ark-joy-track' "$J"
          grep -q 'arkanoid-fullscreen-mode #arkanoid .ark-body' "$J"
          grep -q 'dispatchPaddle' "$J"
          grep -q 'requestAnimationFrame(step)' "$J"
          grep -q '__ourFamilyArkanoidJoystickV1' "$J"
          node --check "$J"
          node --check duoapp/src/main/assets/arkanoid.js
          node --check duoapp/src/main/assets/billiards.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node tools/test_family_624_async.cjs
          node tools/test_turn_sdp_627.cjs

      - name: Ensure scope is isolated
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin family-stable-6
          test "$(git diff --name-only origin/family-stable-6 -- duoapp/src/main/java/com/sergey/duochat/MainActivity.java | wc -l)" -eq 0
          test "$(git diff --name-only origin/family-stable-6 -- duoapp/src/main/assets/billiards.js duoapp/src/main/assets/checkers.js duoapp/src/main/assets/durak.js | wc -l)" -eq 0

      - name: Build APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Inspect APK version
        shell: bash
        run: |
          set -euo pipefail
          A=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" > /tmp/badging647.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging647.txt
          grep -q "versionCode='6047'" /tmp/badging647.txt
          grep -q "versionName='6.0.47'" /tmp/badging647.txt

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html duoapp/src/main/assets/arkanoid_joystick.js
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare OurFamily 6.0.47 Arkanoid joystick'
            git push origin HEAD:release/family-6.0.47-joystick
          fi
