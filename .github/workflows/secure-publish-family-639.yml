name: Secure publish OurFamily 6.0.39

on:
  push:
    branches:
      - release/family-6.0.39-pool-fix
    paths:
      - .github/workflows/secure-publish-family-639.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.39-pool-fix
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Publish one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily639.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily639.key -out /tmp/ourfamily639.crt -days 1 -subj '/CN=OurFamily-6.0.39-One-Time/'
          mkdir -p updates/candidates/signed639
          cp /tmp/ourfamily639.crt updates/candidates/signed639/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed639/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.39 signing certificate'
          git push origin HEAD:release/family-6.0.39-pool-fix
      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin release/family-6.0.39-pool-fix
            if git cat-file -e 'origin/release/family-6.0.39-pool-fix:updates/candidates/signed639/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/release/family-6.0.39-pool-fix:updates/candidates/signed639/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/release/family-6.0.39-pool-fix
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1
      - name: Decrypt signing material in runner only
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily639.crt -inkey /tmp/ourfamily639.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing639
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing639
          test -s /tmp/signing639/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing639/password.txt
      - name: Validate 6.0.39 source and regression fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 6039" duoapp/build.gradle
          grep -q "versionName '6.0.39'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.39"' duoapp/src/main/AndroidManifest.xml
          H=duoapp/src/main/assets/index.html
          D=duoapp/src/main/assets/durak.js
          grep -q 'hubPoolBtn' "$H"
          grep -q 'poolCanvas' "$H"
          grep -q "gameType:'pool'" "$H"
          grep -q 'async function invitePool(peer)' "$H"
          grep -q 'root.PoolRules=' "$D"
          grep -q 'Играть одному · тренировка' "$D"
          grep -q 'function enterSolo' "$D"
          grep -q 'function shootSolo' "$D"
          grep -q 'function getAttachmentObjectUrl' "$H"
          grep -q 'attachmentDownloadPending' "$H"
          grep -q 'keptAttachments' "$H"
          grep -q 'rememberMediaState' "$H"
          grep -q "video.preload='auto'" "$H"
          node --check "$D"
          node --check duoapp/src/main/assets/billiards.js
          node tools/test_checkers.cjs
          node tools/test_durak.cjs
          node tools/test_billiards.cjs
          node - <<'NODE'
          require('./duoapp/src/main/assets/durak.js');
          if(!global.PoolRules) throw new Error('PoolRules not bundled');
          const s=global.PoolRules.initial();
          const r=global.PoolRules.shot(s,0,0,0.55);
          if(!r || r.state.seq!==1 || !Array.isArray(r.frames)) throw new Error('Pool runtime failed');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          for name in ('checkers.js','durak.js'):
              marker=f'<script src="{name}"></script>'
              assert marker in h
              h=h.replace(marker,'<script>\n'+Path('duoapp/src/main/assets/'+name).read_text(encoding='utf-8')+'\n</script>')
          assert 'root.PoolRules=' in h
          assert h.index('root.PoolRules=') < h.index('async function invitePool(peer)')
          assert 'Играть одному · тренировка' in h
          print('POOL_STARTUP_REGRESSION_FIXED')
          PY
      - name: Build unsigned 6.0.39 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Align sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_39_aligned.apk
          S=/tmp/OurFamily_6_0_39_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing639/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign --ks /tmp/signing639/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert639.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging639.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging639.txt
          grep -q "versionCode='6039'" /tmp/badging639.txt
          grep -q "versionName='6.0.39'" /tmp/badging639.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert639.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert639.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert639.txt
      - name: Build update payload and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          apk=Path('/tmp/OurFamily_6_0_39_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v639_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v639_{i:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={'versionCode':6039,'versionName':'6.0.39','apkBase64Parts':urls,'sha256':sha,
                'notes':'Исправлен запуск американского бильярда: движок 8-ball теперь гарантированно загружается внутри Android WebView, поэтому после выбора соперника стол открывается вместо возврата в меню. Добавлен режим «Играть одному · тренировка» без сети и приглашения. Исправления кэша фото, видео и голосовых из 6.0.37 сохранены.'}
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/639.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_39_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk and hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY 6.0.39 bytes',len(apk),'parts',len(chunks),'sha256',sha)
          PY
      - name: Commit release to release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed639/encrypted_payload.b64 updates/candidates/signed639/ephemeral_cert.pem
          rmdir updates/candidates/signed639 2>/dev/null || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates
          git commit -m 'Release OurFamily 6.0.39 stable candidate'
          git push origin HEAD:release/family-6.0.39-pool-fix
      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_39_Stable.apk').read_bytes()
          assert m['versionCode']==6039 and m['versionName']=='6.0.39'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('FINAL_READY',m['versionName'],m['sha256'])
          PY
