name: Secure publish OurFamily 6.0.38

on:
  push:
    branches:
      - release/family-6.0.38-billiards
    paths:
      - .github/workflows/secure-publish-family-638.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.38-billiards
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Publish one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ourfamily638.key >/dev/null 2>&1
          openssl req -new -x509 -sha256 -key /tmp/ourfamily638.key -out /tmp/ourfamily638.crt -days 1 -subj '/CN=OurFamily-6.0.38-One-Time/'
          mkdir -p updates/candidates/signed638
          cp /tmp/ourfamily638.crt updates/candidates/signed638/ephemeral_cert.pem
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add updates/candidates/signed638/ephemeral_cert.pem
          git commit -m 'Publish one-time 6.0.38 signing certificate'
          git push origin HEAD:release/family-6.0.38-billiards
      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 150); do
            git fetch origin release/family-6.0.38-billiards
            if git cat-file -e 'origin/release/family-6.0.38-billiards:updates/candidates/signed638/encrypted_payload.b64' 2>/dev/null; then
              git show 'origin/release/family-6.0.38-billiards:updates/candidates/signed638/encrypted_payload.b64' > /tmp/encrypted_payload.b64
              git reset --hard origin/release/family-6.0.38-billiards
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1
      - name: Decrypt signing material in runner only
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/encrypted_payload.b64 > /tmp/signing_payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/signing_payload.cms -recip /tmp/ourfamily638.crt -inkey /tmp/ourfamily638.key -out /tmp/signing_payload.tar.gz
          mkdir -p /tmp/signing638
          tar -xzf /tmp/signing_payload.tar.gz -C /tmp/signing638
          test -s /tmp/signing638/OurFamily_Stable6_Signing.p12
          test -s /tmp/signing638/password.txt
      - name: Validate 6.0.38 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 6038" duoapp/build.gradle
          grep -q "versionName '6.0.38'" duoapp/build.gradle
          grep -q 'android:label="Наша семья 6.0.38"' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.38'" duoapp/src/main/assets/index.html
          grep -q 'hubPoolBtn' duoapp/src/main/assets/index.html
          grep -q 'poolCanvas' duoapp/src/main/assets/index.html
          grep -q "gameType:'pool'" duoapp/src/main/assets/index.html
          grep -q 'function receivePool' duoapp/src/main/assets/index.html
          grep -q 'function poolShoot' duoapp/src/main/assets/index.html
          grep -q 'billiards.js' duoapp/src/main/assets/index.html
          test ! -e duoapp/src/main/assets/ludo.js
          ! grep -qi 'Семейная гонка\|hubLudoBtn\|LudoRules' duoapp/src/main/assets/index.html
          grep -q 'function getAttachmentObjectUrl' duoapp/src/main/assets/index.html
          grep -q 'attachmentDownloadPending' duoapp/src/main/assets/index.html
          grep -q 'keptAttachments' duoapp/src/main/assets/index.html
          grep -q 'rememberMediaState' duoapp/src/main/assets/index.html
          grep -q "video.preload='auto'" duoapp/src/main/assets/index.html
          node --check duoapp/src/main/assets/billiards.js
          node tools/test_billiards.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8')
          assert h.count('function renderAttachmentInto(')==1
          assert h.count('function getAttachmentObjectUrl(')==1
          assert h.count('function renderMessages(){')==1
          assert h.count('function receivePool(')==1
          assert h.count('function poolShoot(')==1
          assert "b.appendChild(kept)" in h
          assert 'hubLudoBtn' not in h and 'LudoRules' not in h and 'Семейная гонка' not in h
          Path('/tmp/family638.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/family638.js
      - name: Build unsigned 6.0.38 APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
      - name: Align sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          U=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          A=/tmp/OurFamily_6_0_38_aligned.apk
          S=/tmp/OurFamily_6_0_38_Stable.apk
          PASS=$(tr -d '\r\n' < /tmp/signing638/password.txt)
          "$BT/zipalign" -p -f 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" >/dev/null
          "$BT/apksigner" sign --ks /tmp/signing638/OurFamily_Stable6_Signing.p12 --ks-type PKCS12 --ks-key-alias ourfamily6 --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" > /tmp/cert638.txt
          "$BT/aapt" dump badging "$S" > /tmp/badging638.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging638.txt
          grep -q "versionCode='6038'" /tmp/badging638.txt
          grep -q "versionName='6.0.38'" /tmp/badging638.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert638.txt | sed 's/.*: //')
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert638.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert638.txt
      - name: Build update payload and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          apk=Path('/tmp/OurFamily_6_0_38_Stable.apk').read_bytes()
          sha=hashlib.sha256(apk).hexdigest()
          b64=base64.b64encode(apk).decode('ascii')
          chunks=[b64[i:i+16000] for i in range(0,len(b64),16000)]
          parts=Path('updates/parts'); parts.mkdir(parents=True,exist_ok=True)
          for p in parts.glob('v638_*.b64'): p.unlink()
          base='https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/'
          urls=[]
          for i,c in enumerate(chunks):
              name=f'v638_{i:02d}.b64'
              (parts/name).write_text(c,encoding='ascii')
              urls.append(base+name)
          meta={
            'versionCode':6038,
            'versionName':'6.0.38',
            'apkBase64Parts':urls,
            'sha256':sha,
            'notes':'Новая семейная игра: американский бильярд 8-ball 1 на 1 вместо Семейной гонки. Добавлены красивый объёмный стол, прицеливание касанием, регулировка силы удара, плавная физика шаров, лузы, сплошные и полосатые шары, фолы, восьмёрка, приглашения из игрового клуба и синхронизация ходов между телефонами. Исправления кэша фото, видео и голосовых из 6.0.37 полностью сохранены.'
          }
          text=json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          Path('updates/candidates').mkdir(parents=True,exist_ok=True)
          Path('updates/candidates/638.json').write_text(text,encoding='utf-8')
          Path('updates/latest.json').write_text(text,encoding='utf-8')
          Path('updates/downloads').mkdir(parents=True,exist_ok=True)
          Path('updates/downloads/OurFamily_6_0_38_Stable.apk').write_bytes(apk)
          rebuilt=base64.b64decode(''.join((parts/u.rsplit('/',1)[-1]).read_text(encoding='ascii') for u in urls))
          assert rebuilt==apk
          assert hashlib.sha256(rebuilt).hexdigest()==sha
          print('READY 6.0.38 bytes',len(apk),'parts',len(chunks),'sha256',sha)
          PY
      - name: Commit release to release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f updates/candidates/signed638/encrypted_payload.b64 updates/candidates/signed638/ephemeral_cert.pem
          rmdir updates/candidates/signed638 2>/dev/null || true
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add -A updates
          git commit -m 'Release OurFamily 6.0.38 stable candidate'
          git push origin HEAD:release/family-6.0.38-billiards
      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          m=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          apk=Path('updates/downloads/OurFamily_6_0_38_Stable.apk').read_bytes()
          assert m['versionCode']==6038 and m['versionName']=='6.0.38'
          assert hashlib.sha256(apk).hexdigest()==m['sha256']
          print('FINAL_READY',m['versionName'],m['sha256'])
          PY
