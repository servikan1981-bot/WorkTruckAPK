name: Deploy free Our Family relay

on:
  workflow_dispatch:
  push:
    branches: [ family-stable-6 ]
    paths:
      - 'family-relay/**'
      - '.github/workflows/deploy-family-relay.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check private Cloudflare deployment credentials
        id: access
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'CLOUDFLARE_API_TOKEN is missing; deployment cannot proceed.' >&2
            exit 1
          fi
      - name: Register free workers.dev subdomain when absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          endpoint = 'https://api.cloudflare.com/client/v4/accounts/860c7981b2d45d79a28a2f18ab9f101f/workers/subdomain'
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'],
                     'Content-Type': 'application/json'}
          def request(method, body=None):
              payload = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(endpoint, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as error:
                  if method == 'GET' and error.code == 404:
                      return None
                  raise RuntimeError(f'Cloudflare subdomain {method} failed: HTTP {error.code}') from None
          existing = request('GET')
          if existing and existing.get('success') and existing.get('result', {}).get('subdomain'):
              print('Using existing workers.dev subdomain: ' + existing['result']['subdomain'])
          else:
              created = request('PUT', {'subdomain': 'family-860c7981b2d4'})
              if not created.get('success'):
                  raise SystemExit('Cloudflare rejected workers.dev subdomain registration')
              print('Created workers.dev subdomain: ' + created['result']['subdomain'])
          PY
      - name: Deploy Worker with SQLite Durable Objects
        if: steps.access.outputs.ready == 'true'
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 860c7981b2d45d79a28a2f18ab9f101f
          workingDirectory: family-relay
          command: deploy
      - name: Verify deployed relay
        if: steps.access.outputs.ready == 'true'
        env:
          RELAY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          url = os.environ['RELAY_URL'].strip().rstrip('/')
          if not re.fullmatch(r'https://[A-Za-z0-9.-]+\.workers\.dev', url):
              raise SystemExit('Wrangler did not report a workers.dev HTTPS URL')
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url + '/health', headers={'User-Agent': 'Dalvik/2.1.0 (Linux; U; Android 14; Pixel 7)'}), timeout=15) as response:
                      assert response.status == 200
                      assert json.load(response)['protocol'] == 'ourfamily-relay-v1'
                  print('Relay is serving HTTPS: ' + url)
                  break
              except urllib.error.HTTPError as error:
                  detail = error.read(700).decode('utf-8', 'replace')
                  raise RuntimeError(f'Relay returned HTTP {error.code}: {detail[:500]}') from None
              except Exception as error:
                  if attempt == 17:
                      raise RuntimeError('Relay HTTPS did not become available after 3 minutes') from error
                  time.sleep(10)
          PY
      - name: Verify live messages, status events, and encrypted attachments
        if: steps.access.outputs.ready == 'true'
        env:
          RELAY_TEST_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node --test test/protocol-live.mjs; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 15
          done
        working-directory: family-relay
