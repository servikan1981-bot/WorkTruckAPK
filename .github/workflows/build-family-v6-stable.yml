name: Build Our Family 6.0 Stable

on:
  workflow_dispatch:
  push:
    branches: [ family-v6-stable ]
    paths:
      - 'duoapp/**'
      - 'settings-duo.gradle'
      - '.github/workflows/build-family-v6-stable.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('duoapp/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>', h, flags=re.S)
          assert blocks
          Path('/tmp/family6.js').write_text('\n'.join(blocks))
          assert "APP_VERSION='6.0'" in h
          assert "Проверить обновления" in h
          PY
          node --check /tmp/family6.js

      - name: Validate stable identity and updater
        run: |
          grep -q "applicationId 'com.sergey.ourfamily'" duoapp/build.gradle
          grep -q "versionCode 60000" duoapp/build.gradle
          grep -q "versionName '6.0'" duoapp/build.gradle
          grep -q "REQUEST_INSTALL_PACKAGES" duoapp/src/main/AndroidManifest.xml
          grep -q "UpdateInstallReceiver" duoapp/src/main/AndroidManifest.xml
          grep -q "family-app-updates/updates/latest.json" duoapp/src/main/java/com/sergey/duochat/UpdateManager.java
          grep -q "PackageInstaller" duoapp/src/main/java/com/sergey/duochat/UpdateManager.java

      - name: Validate lock-screen call answer
        run: |
          S=duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          R=duoapp/src/main/java/com/sergey/duochat/CallActionReceiver.java
          I=duoapp/src/main/java/com/sergey/duochat/IncomingCallActivity.java
          grep -q "CallStyle.forIncomingCall" "$S"
          grep -q "PendingIntent.getBroadcast" "$S"
          grep -q "ACTION_ACCEPT" "$R"
          grep -q "ACTION_DECLINE" "$R"
          grep -q "setFullScreenIntent" "$S"
          grep -q "setShowWhenLocked" "$I"

      - name: Validate existing functions retained
        run: |
          H=duoapp/src/main/assets/index.html
          for token in direct_chat group_chat receipt_read REACTIONS openPhotoViewer scrollChatToBottom consumeNativeNavigation familyPresenceTopic openAdminArchiveScreen "Семейные новости" switchCamera enableSelfDrag startRingback speakerBtn layout-pip; do
            grep -q "$token" "$H"
          done
          grep -q "startPresenceWorker" duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          grep -q "PositiveNewsFetcher" duoapp/src/main/java/com/sergey/duochat/MessagingService.java

      - name: Build unsigned release APK
        run: gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease

      - name: Verify unsigned APK
        run: |
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q "Наша семья 6.0"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_unsigned
          path: duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          if-no-files-found: error
