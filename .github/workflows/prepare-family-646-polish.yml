name: Prepare OurFamily 6.0.46 polish

on:
  push:
    branches: ['release/family-6.0.46-polish']
    paths:
      - '.github/workflows/prepare-family-646-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/family-6.0.46-polish
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Apply polish patch
        run: python3 tools/apply_family_646.py

      - name: Validate version
        run: |
          set -euo pipefail
          grep -q 'versionCode 6046' duoapp/build.gradle
          grep -q "versionName '6.0.46'" duoapp/build.gradle
          grep -q '6.0.46' duoapp/src/main/AndroidManifest.xml
          grep -q "APP_VERSION='6.0.46'" duoapp/src/main/assets/index.html

      - name: Validate redesigned games hub
        run: |
          set -euo pipefail
          H=duoapp/src/main/assets/index.html
          grep -q 'id="design646"' "$H"
          test "$(grep -o 'id="hubCheckersBtn"' "$H" | wc -l)" -eq 1
          test "$(grep -o 'id="hubDurakBtn"' "$H" | wc -l)" -eq 1
          test "$(grep -o 'id="hubPoolBtn"' "$H" | wc -l)" -eq 1
          test "$(grep -o 'id="hubArkanoidBtn"' "$H" | wc -l)" -eq 1
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' "$H"
          grep -q 'hub.dataset.arkanoidBound' duoapp/src/main/assets/arkanoid.js

      - name: Validate optimization and video safety
        run: |
          set -euo pipefail
          H=duoapp/src/main/assets/index.html
          grep -q 'function photoUploadTargetSize()' "$H"
          grep -q 'var chatScrollGeneration=0' "$H"
          grep -q 'RTCPeerConnection' "$H"
          grep -q 'prepareLocalMedia' "$H"
          grep -q 'captureChatVideoBtn' "$H"
          git diff origin/family-stable-6 --exit-code -- duoapp/src/main/java/com/sergey/duochat/MainActivity.java
          git diff origin/family-stable-6 --exit-code -- duoapp/src/main/assets/ludo.js

      - name: Validate asset JavaScript syntax
        run: |
          set -euo pipefail
          node --check duoapp/src/main/assets/arkanoid.js
          node --check duoapp/src/main/assets/billiards.js
          node --check duoapp/src/main/assets/checkers.js
          node --check duoapp/src/main/assets/durak.js
          node --check duoapp/src/main/assets/ludo.js

      - name: Validate inline JavaScript syntax
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import re; h=Path('duoapp/src/main/assets/index.html').read_text(encoding='utf-8'); Path('/tmp/family646-inline.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S)),encoding='utf-8'); assert h.count('id=\"hubArkanoidBtn\"')==1; assert 'setTimeout(go,420)' not in h"
          node --check /tmp/family646-inline.js

      - name: Test checkers
        run: node tools/test_checkers.cjs
      - name: Test Durak
        run: node tools/test_durak.cjs
      - name: Test billiards
        run: node tools/test_billiards.cjs
      - name: Test async messaging regression
        run: node tools/test_family_624_async.cjs
      - name: Validate legacy Ludo unchanged
        run: git diff origin/family-stable-6 --exit-code -- duoapp/src/main/assets/ludo.js tools/test_ludo.cjs
      - name: Test TURN SDP regression
        run: node tools/test_turn_sdp_627.cjs

      - name: Build and inspect APK
        run: |
          set -euo pipefail
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          APK=duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/aapt" dump badging "$APK" > /tmp/badging646.txt
          grep -q "package: name='com.sergey.ourfamily'" /tmp/badging646.txt
          grep -q "versionCode='6046'" /tmp/badging646.txt
          grep -q "versionName='6.0.46'" /tmp/badging646.txt
          unzip -l "$APK" | grep -q 'assets/arkanoid.js'
          unzip -l "$APK" | grep -q 'assets/billiards.js'
          unzip -l "$APK" | grep -q 'assets/checkers.js'
          unzip -l "$APK" | grep -q 'assets/durak.js'

      - name: Commit validated polish
        run: |
          set -euo pipefail
          git config user.name ourfamily-release-bot
          git config user.email ourfamily-release-bot@users.noreply.github.com
          git add duoapp/build.gradle duoapp/src/main/AndroidManifest.xml duoapp/src/main/assets/index.html duoapp/src/main/assets/arkanoid.js
          if ! git diff --cached --quiet; then
            git commit -m 'Polish and optimize OurFamily 6.0.46'
            git push origin HEAD:release/family-6.0.46-polish
          fi
