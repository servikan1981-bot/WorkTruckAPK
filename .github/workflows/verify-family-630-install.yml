name: Verify OurFamily 6.0.30 candidate upgrade

on:
  push:
    branches: [family-630-game-fix]
    paths:
      - '.github/workflows/verify-family-630-install.yml'
      - 'updates/candidates/sign630.delta.json'
      - 'tools/patch_family_630.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rebuild exact 6.0.30 unsigned candidate
        run: |
          python3 tools/patch_family_630.py
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleRelease
          echo '50a0f642a4afe2a02da37ff3690a676056e61fbeba2b84c905171b7ec9f16755  duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk' | sha256sum -c -

      - name: Reconstruct signed Stable-6 candidate
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          base = Path('duoapp/build/outputs/apk/release/duoapp-release-unsigned.apk').read_bytes()
          patch = json.loads(Path('updates/candidates/sign630.delta.json').read_text())
          got = hashlib.sha256(base).hexdigest()
          assert got == patch['base_sha256'], (got, patch['base_sha256'])
          out = bytearray()
          for op in patch['ops']:
              if op[0] == 'c':
                  start, length = int(op[1]), int(op[2])
                  out.extend(base[start:start+length])
              elif op[0] == 'd':
                  out.extend(base64.b64decode(op[1]))
              else:
                  raise SystemExit('unknown delta opcode')
          assert len(out) == patch['target_size']
          target = hashlib.sha256(out).hexdigest()
          assert target == patch['target_sha256'], (target, patch['target_sha256'])
          Path('/tmp/OurFamily_6_0_30_Candidate.apk').write_bytes(out)
          print('signed candidate sha256', target)
          PY

      - name: Verify official Android signature and identity
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=/tmp/OurFamily_6_0_30_Candidate.apk
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert630.txt
          "$BT/apksigner" verify --print-certs updates/downloads/OurFamily_6_0_29_Stable.apk | tee /tmp/cert629.txt
          grep -qi '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83' /tmp/cert630.txt
          grep -qi '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83' /tmp/cert629.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert630.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert630.txt
          "$BT/aapt" dump badging "$APK" | grep -q "package: name='com.sergey.ourfamily' versionCode='6030' versionName='6.0.30'"
          echo '55f51580f2f8c368a8351aac719dc8d08a36e8088284bbde761aa195e5dfa020  /tmp/OurFamily_6_0_30_Candidate.apk' | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade 6.0.29 to 6.0.30 and launch on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r updates/downloads/OurFamily_6_0_29_Stable.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m 1 'versionCode=6029'
            adb install -r /tmp/OurFamily_6_0_30_Candidate.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m 1 'versionCode=6030'
            adb shell monkey -p com.sergey.ourfamily 1
            sleep 3
            adb shell pidof com.sergey.ourfamily

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_30_Candidate_verified
          path: /tmp/OurFamily_6_0_30_Candidate.apk
          if-no-files-found: error
