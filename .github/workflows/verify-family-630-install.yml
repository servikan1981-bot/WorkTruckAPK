name: Verify OurFamily 6.0.30 upgrade mechanics

on:
  push:
    branches: [family-630-game-fix]
    paths:
      - '.github/workflows/verify-family-630-install.yml'
      - 'tools/patch_family_630.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build untouched 6.0.29 debug baseline
        run: |
          grep -q 'versionCode 6029' duoapp/build.gradle
          grep -q "versionName '6.0.29'" duoapp/build.gradle
          gradle --no-daemon -c settings-duo.gradle :duoapp:assembleDebug
          cp duoapp/build/outputs/apk/debug/duoapp-debug.apk /tmp/OurFamily_6_0_29_test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/OurFamily_6_0_29_test.apk | grep -q "package: name='com.sergey.ourfamily' versionCode='6029' versionName='6.0.29'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_29_test.apk > /tmp/cert629-ci.txt

      - name: Patch and build 6.0.30 debug candidate
        run: |
          python3 tools/patch_family_630.py
          gradle --no-daemon -c settings-duo.gradle :duoapp:clean :duoapp:assembleDebug
          cp duoapp/build/outputs/apk/debug/duoapp-debug.apk /tmp/OurFamily_6_0_30_test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/OurFamily_6_0_30_test.apk | grep -q "package: name='com.sergey.ourfamily' versionCode='6030' versionName='6.0.30'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_30_test.apk > /tmp/cert630-ci.txt
          grep -q 'newSingleThreadExecutor' duoapp/src/main/java/com/sergey/duochat/ReliableRelayOutbox.java
          grep -q 'family_games_v630' duoapp/src/main/java/com/sergey/duochat/MessagingService.java
          grep -q 'MainActivity.notifyRelayArrived();' duoapp/src/main/java/com/sergey/duochat/RelayInbox.java
          grep -q 'setInterval(pollInbox,350)' duoapp/src/main/assets/index.html

      - name: Confirm both CI builds use the same signer
        run: |
          CERT629=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert629-ci.txt | awk '{print $NF}')
          CERT630=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert630-ci.txt | awk '{print $NF}')
          test -n "$CERT629"
          test "$CERT629" = "$CERT630"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade 6.0.29 to 6.0.30 and launch on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eux
            adb install -r /tmp/OurFamily_6_0_29_test.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m 1 'versionCode=6029'
            adb shell monkey -p com.sergey.ourfamily 1
            sleep 2
            adb shell pidof com.sergey.ourfamily

            adb install -r /tmp/OurFamily_6_0_30_test.apk
            adb shell dumpsys package com.sergey.ourfamily | grep -m 1 'versionCode=6030'
            adb shell monkey -p com.sergey.ourfamily 1
            sleep 3
            adb shell pidof com.sergey.ourfamily

            adb shell am force-stop com.sergey.ourfamily
            adb shell monkey -p com.sergey.ourfamily 1
            sleep 2
            adb shell pidof com.sergey.ourfamily

      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_30_upgrade-test-results
          path: |
            /tmp/cert629-ci.txt
            /tmp/cert630-ci.txt
          if-no-files-found: error
