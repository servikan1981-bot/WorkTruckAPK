name: Build WorkTruck APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare navigation and feature cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/worktruck/catalog/V53Activity.java')
          s=p.read_text(encoding='utf-8')

          old_nav='n.addView(nav("●","Профиль",4,this::showProfile),weight());return n;'
          new_nav='n.addView(nav("●","Профиль",4,this::showProfile),weight());n.addView(nav("◎","Тур",5,()->startActivity(new Intent(this,TourActivity.class))),weight());return n;'
          if old_nav in s:
              s=s.replace(old_nav,new_nav)

          anchor='b.addView(hero("КАТАЛОГ ПО УЗЛАМ","94 851 позиция разнесена по системам Scania","Открыть каталоги",this::showCategories),lp(-1,dp(145),0,12,0,0));'
          hub='b.addView(hero("КЛИЕНТУ","Автопарк, бонусы, ожидание деталей, статус заказа и персональный менеджер","Открыть раздел",()->startActivity(new Intent(this,ClientHubActivity.class))),lp(-1,dp(145),0,12,0,0));'
          tour='b.addView(hero("ЭКСКУРСИЯ","4 панорамы территории Work Truck — маршрут по площадке","Начать экскурсию",()->startActivity(new Intent(this,TourActivity.class))),lp(-1,dp(145),0,12,0,0));'
          game='b.addView(hero("ИГРА · УГАДАЙ ЗАПЧАСТЬ","10 коротких вопросов про детали Scania и тестовый приз за результат","Играть",()->startActivity(new Intent(this,GameActivity.class))),lp(-1,dp(145),0,12,0,0));'

          # Normalize any previous runtime-injected cards, then build the block in a fixed order.
          for card in (hub,tour,game):
              s=s.replace('\n        '+card,'')
          if anchor not in s:
              raise SystemExit('Catalog anchor not found; refusing to build without Client hub')
          s=s.replace(anchor, anchor+'\n        '+hub+'\n        '+tour+'\n        '+game, 1)
          p.write_text(s,encoding='utf-8')

          # Fail fast if the exact Client card is not in the source being compiled.
          out=p.read_text(encoding='utf-8')
          assert 'hero("КЛИЕНТУ"' in out
          assert 'ClientHubActivity.class' in out
          assert out.index('hero("КЛИЕНТУ"') < out.index('hero("ЭКСКУРСИЯ"') < out.index('hero("ИГРА · УГАДАЙ ЗАПЧАСТЬ"')
          print('CLIENT HUB CARD CONFIRMED IN COMPILED SOURCE')
          PY

          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_01.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_02.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_03.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_04.jpg

          grep -q 'ClientHubActivity' app/src/main/AndroidManifest.xml
          grep -q 'hero("КЛИЕНТУ"' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q 'Мой автопарк' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Бонусный кошелёк' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Сообщить о поступлении' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Где мой заказ' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Персональный менеджер' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          test -s "$APK"
          strings "$APK" | grep -q 'ClientHubActivity' || true
          ls -lh "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkTruck_V5_9_1_client_hub_fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTruck_V5_9_1_client_hub_fixed
          path: WorkTruck_V5_9_1_client_hub_fixed.apk
          if-no-files-found: error
