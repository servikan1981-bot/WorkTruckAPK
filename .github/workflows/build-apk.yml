name: Build WorkTruck APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch V5.3 navigation and native tour renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/worktruck/catalog/V53Activity.java')
          s=p.read_text(encoding='utf-8')
          old='n.addView(nav("●","Профиль",4,this::showProfile),weight());return n;'
          new='n.addView(nav("◎","Экскурсия",4,()->startActivity(new Intent(this,TourActivity.class))),weight());return n;'
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          t=Path('app/src/main/java/com/worktruck/catalog/TourActivity.java')
          x=t.read_text(encoding='utf-8')
          x=x.replace('c.drawBitmap(world,new RectF(left,top,left+sw,top+sh),dst,p);',
                      'c.drawBitmap(world,new Rect((int)left,(int)top,(int)(left+sw),(int)(top+sh)),dst,p);')
          x=x.replace('c.drawBitmap(world,new RectF(left,top,W,top+sh),d1,p);',
                      'c.drawBitmap(world,new Rect((int)left,(int)top,W,(int)(top+sh)),d1,p);')
          x=x.replace('c.drawBitmap(world,new RectF(0,top,sw-first,top+sh),d2,p);',
                      'c.drawBitmap(world,new Rect(0,(int)top,(int)(sw-first),(int)(top+sh)),d2,p);')
          t.write_text(x,encoding='utf-8')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk && ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkTruck_v5_3_exsp.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTruck_v5_3_exsp
          path: WorkTruck_v5_3_exsp.apk
          if-no-files-found: error
