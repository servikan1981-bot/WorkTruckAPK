name: Build WorkTruck APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare V5.3 real 360 tour assets and fast startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/worktruck/catalog/V53Activity.java')
          s=p.read_text(encoding='utf-8')
          old_nav='n.addView(nav("●","Профиль",4,this::showProfile),weight());return n;'
          new_nav='n.addView(nav("◎","Экскурсия",4,()->startActivity(new Intent(this,TourActivity.class))),weight());return n;'
          if old_nav in s:
              s=s.replace(old_nav,new_nav)
          old_start='''        showSplash();\n        new Thread(()->{\n            try{database=new Database(this);database.open();dbReady=true;}catch(Throwable e){dbReady=false;}\n            runOnUiThread(()->new Handler(Looper.getMainLooper()).postDelayed(this::showHome,550));\n        }).start();'''
          new_start='''        showSplash();\n        new Handler(Looper.getMainLooper()).postDelayed(this::showHome,280);\n        new Thread(()->{\n            try{database=new Database(this);database.open();dbReady=true;}catch(Throwable e){dbReady=false;}\n        }).start();'''
          if old_start in s:
              s=s.replace(old_start,new_start)
          p.write_text(s,encoding='utf-8')
          PY

          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/autoshop_01.jpg' \
            -o app/src/main/res/drawable-nodpi/autoshop_01.jpg
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/garage.jpg' \
            -o app/src/main/res/drawable-nodpi/garage.jpg
          file app/src/main/res/drawable-nodpi/autoshop_01.jpg
          file app/src/main/res/drawable-nodpi/garage.jpg
          test -s app/src/main/res/drawable-nodpi/autoshop_01.jpg
          test -s app/src/main/res/drawable-nodpi/garage.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'autoshop_01|garage.jpg'
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkTruck_v5_3_exsp.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTruck_v5_3_exsp
          path: WorkTruck_v5_3_exsp.apk
          if-no-files-found: error
