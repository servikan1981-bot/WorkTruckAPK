name: Build WorkTruck APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V6.8 deduplicated navigation
        run: python3 tools/prepare_v60.py

      - name: Prepare panorama resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_01.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_02.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_03.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_04.jpg

      - name: Verify prepared source
        run: |
          grep -q 'ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'V6.8 DEDUPLICATED' tools/prepare_v60.py
          grep -q 'sosNav' tools/prepare_v60.py
          grep -q 'hero("КАТАЛОГ"' tools/prepare_v60.py
          grep -q 'sosMenu' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Мои заявки' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Профиль' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Сергей Аникинов' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q '79503512841' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'LocationManager' app/src/main/java/com/worktruck/catalog/SosActivity.java
          grep -q 'yandex.ru/maps/?pt=' app/src/main/java/com/worktruck/catalog/SosActivity.java
          grep -q 'tg://resolve?phone=' app/src/main/java/com/worktruck/catalog/SosActivity.java
          grep -q 'ServiceActivity' app/src/main/AndroidManifest.xml
          grep -q 'VehicleJournalActivity' app/src/main/AndroidManifest.xml
          grep -q 'SosActivity' app/src/main/AndroidManifest.xml
          grep -q 'ErrorGuideActivity' app/src/main/AndroidManifest.xml
          grep -q 'Сервис Work Truck' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Журнал автомобиля и ТО' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Машина встала · SOS' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Справочник ошибок Scania' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'OwnerServicesBackendContract' app/src/main/java/com/worktruck/catalog/OwnerServicesBackendContract.java
          grep -q 'last_report' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'MultiLookupActivity' app/src/main/AndroidManifest.xml
          grep -q 'Подбор по VIN · Scania Multi' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'SCANNIA' app/src/main/java/com/worktruck/catalog/MultiLookupActivity.java || true
          grep -q 'Scania Multi Parts Web' app/src/main/java/com/worktruck/catalog/MultiLookupActivity.java
          grep -q 'ПРОВЕРИТЬ НАЛИЧИЕ' app/src/main/java/com/worktruck/catalog/MultiLookupActivity.java
          grep -q 'MultiBackendContract' app/src/main/java/com/worktruck/catalog/MultiBackendContract.java
          grep -q 'ScaniaChatActivity' app/src/main/AndroidManifest.xml
          grep -q 'Чат владельцев Scania' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'DiagnosticActivity' app/src/main/AndroidManifest.xml
          grep -q 'BLUETOOTH_SCAN' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_FOUND' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'startDiscovery' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'createBond' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'НАЙТИ НОВЫЕ УСТРОЙСТВА' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'МОИ МАШИНЫ' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q 'НОВЫЕ ПОСТУПЛЕНИЯ' app/src/main/java/com/worktruck/catalog/V53Activity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          test -s "$APK"
          ls -lh "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkTruck_V6_8_NewNavigation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTruck_V6_8_NewNavigation
          path: WorkTruck_V6_7_ManagerSOS.apk
          if-no-files-found: error
