name: Build WorkTruck APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare navigation and feature cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/worktruck/catalog/V53Activity.java')
          s=p.read_text(encoding='utf-8')

          old_nav='n.addView(nav("●","Профиль",4,this::showProfile),weight());return n;'
          new_nav='n.addView(nav("●","Профиль",4,this::showProfile),weight());n.addView(nav("◎","Тур",5,()->startActivity(new Intent(this,TourActivity.class))),weight());return n;'
          if old_nav in s:
              s=s.replace(old_nav,new_nav)

          anchor='b.addView(hero("КАТАЛОГ ПО УЗЛАМ","94 851 позиция разнесена по системам Scania","Открыть каталоги",this::showCategories),lp(-1,dp(145),0,12,0,0));'
          hub='b.addView(hero("КЛИЕНТУ","Автопарк, бонусы, ожидание деталей, статус заказа и персональный менеджер","Открыть",()->startActivity(new Intent(this,ClientHubActivity.class))),lp(-1,dp(145),0,12,0,0));'
          tour='b.addView(hero("ЭКСКУРСИЯ","4 панорамы территории Work Truck — маршрут по площадке","Начать экскурсию",()->startActivity(new Intent(this,TourActivity.class))),lp(-1,dp(145),0,12,0,0));'
          game='b.addView(hero("ИГРА · УГАДАЙ ЗАПЧАСТЬ","10 коротких вопросов про детали Scania и тестовый приз за результат","Играть",()->startActivity(new Intent(this,GameActivity.class))),lp(-1,dp(145),0,12,0,0));'

          if anchor in s and '"КЛИЕНТУ"' not in s:
              s=s.replace(anchor,anchor+'\n        '+hub)
          if '"ЭКСКУРСИЯ"' not in s:
              if hub in s:
                  s=s.replace(hub,hub+'\n        '+tour)
              elif anchor in s:
                  s=s.replace(anchor,anchor+'\n        '+tour)
          if '"ИГРА · УГАДАЙ ЗАПЧАСТЬ"' not in s:
              if tour in s:
                  s=s.replace(tour,tour+'\n        '+game)
              elif hub in s:
                  s=s.replace(hub,hub+'\n        '+game)
              elif anchor in s:
                  s=s.replace(anchor,anchor+'\n        '+game)
          p.write_text(s,encoding='utf-8')
          PY

          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_01.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_02.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_03.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_04.jpg

          grep -q 'TourActivity' app/src/main/AndroidManifest.xml
          grep -q 'GameActivity' app/src/main/AndroidManifest.xml
          grep -q 'ClientHubActivity' app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation="portrait"' app/src/main/AndroidManifest.xml
          grep -q 'tour_04' app/src/main/java/com/worktruck/catalog/TourActivity.java
          grep -q 'nudge(0f,-0.13f)' app/src/main/java/com/worktruck/catalog/TourActivity.java
          grep -q 'Угадай запчасть' app/src/main/java/com/worktruck/catalog/GameActivity.java
          grep -q 'Мой автопарк' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Бонусный кошелёк' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Сообщить о поступлении' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Где мой заказ' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Персональный менеджер' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q '"Профиль"' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q '"Тур"' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q '"КЛИЕНТУ"' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q '"ИГРА · УГАДАЙ ЗАПЧАСТЬ"' app/src/main/java/com/worktruck/catalog/V53Activity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | tail -20
          ls -lh "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkTruck_V5_9_client_hub.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTruck_V5_9_client_hub
          path: WorkTruck_V5_9_client_hub.apk
          if-no-files-found: error
