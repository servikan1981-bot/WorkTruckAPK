name: Build WorkTruck APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V6.3 UI and chat
        run: python3 tools/prepare_v60.py

      - name: Prepare panorama resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_01.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_02.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_03.jpg
          cp app/src/main/res/drawable-nodpi/company_panorama.jpg app/src/main/res/drawable-nodpi/tour_04.jpg

      - name: Verify prepared source
        run: |
          grep -q 'ScaniaChatActivity' app/src/main/AndroidManifest.xml
          grep -q 'Чат владельцев Scania' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Общий чат' app/src/main/java/com/worktruck/catalog/ScaniaChatActivity.java
          grep -q '5 серия Scania' app/src/main/java/com/worktruck/catalog/ScaniaChatActivity.java
          grep -q 'ChatBackendContract' app/src/main/java/com/worktruck/catalog/ChatBackendContract.java
          grep -q 'DiagnosticActivity' app/src/main/AndroidManifest.xml
          grep -q 'BLUETOOTH_CONNECT' app/src/main/AndroidManifest.xml
          grep -q 'МОИ МАШИНЫ' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q 'НОВЫЕ ПОСТУПЛЕНИЯ' app/src/main/java/com/worktruck/catalog/V53Activity.java
          grep -q 'Диагностика ELM327' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'createRfcommSocketToServiceRecord' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'СЧИТАТЬ ОШИБКИ И ПАРАМЕТРЫ' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'parseDtcs' app/src/main/java/com/worktruck/catalog/DiagnosticActivity.java
          grep -q 'Экскурсия по Work Truck' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Игра · Угадай запчасть' app/src/main/java/com/worktruck/catalog/MoreActivity.java
          grep -q 'Бонусный кошелёк' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Сообщить о поступлении' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Где мой заказ' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java
          grep -q 'Персональный менеджер' app/src/main/java/com/worktruck/catalog/ClientHubActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          test -s "$APK"
          ls -lh "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkTruck_V6_3_ScaniaChat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTruck_V6_3_ScaniaChat
          path: WorkTruck_V6_3_ScaniaChat.apk
          if-no-files-found: error
