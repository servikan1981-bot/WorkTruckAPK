name: Map staged v630 chunks
on:
  push:
    branches: [family-630-game-fix]
    paths: ['.github/workflows/debug-sign630-delta.yml']
permissions:
  contents: read
  actions: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch unsigned base and staged chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11077063654/zip" -o /tmp/base.zip
          mkdir /tmp/base && unzip -q /tmp/base.zip -d /tmp/base
          BASE=$(find /tmp/base -type f -name '*.apk' | head -1); cp "$BASE" /tmp/base.apk
          mkdir /tmp/p
          for n in $(seq 0 9); do p=$(printf '%02d' "$n"); curl -fsSL "https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/v630_${p}.b64?x=${GITHUB_RUN_ID}" -o "/tmp/p/$p"; done
      - name: Map anchors
        run: |
          python3 - <<'PY'
          import base64,json,hashlib
          from pathlib import Path
          base=Path('/tmp/base.apk').read_bytes(); d=json.loads(Path('updates/candidates/sign630.delta.json').read_text())
          out=bytearray()
          for op in d['ops']:
            if op[0]=='c': out.extend(base[int(op[1]):int(op[1])+int(op[2])])
            elif op[0]=='d': out.extend(base64.b64decode(op[1]))
          raw=bytes(out); rb=base64.b64encode(raw).decode()
          print('delta bytes',len(raw),'b64',len(rb),'sha',hashlib.sha256(raw).hexdigest(),'expected target b64',((int(d['target_size'])+2)//3)*4)
          for p in sorted(Path('/tmp/p').iterdir()):
            s=''.join(p.read_text().split()); L=len(s)
            print('\nPART',p.name,'len',L)
            for off,label in [(0,'start'),(max(0,L//2-250),'mid'),(max(0,L-500),'end')]:
              a=s[off:off+500]
              pos=rb.find(a)
              print(label,'anchor off',off,'delta_pos',pos,'implied_target_pos_if_after_gap',pos+1768 if pos>=0 else -1)
          PY
