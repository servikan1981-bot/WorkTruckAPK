name: Inspect staged v630 encoding
on:
  push:
    branches: [family-630-game-fix]
    paths: ['.github/workflows/debug-sign630-delta.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all staged v630 part boundaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/p630
          for n in $(seq 0 9); do
            p=$(printf '%02d' "$n")
            curl --retry 4 -fsSL "https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/v630_${p}.b64?x=${GITHUB_RUN_ID}" -o "/tmp/p630/${p}.txt"
          done
          python3 - <<'PY'
          import base64,re,hashlib
          from pathlib import Path
          for p in sorted(Path('/tmp/p630').glob('*.txt')):
              s=''.join(p.read_text().split())
              bad=[(i,c) for i,c in enumerate(s) if c not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=']
              eq=s.find('=')
              print(p.name,'len',len(s),'mod4',len(s)%4,'first_eq',eq,'eq_count',s.count('='),'bad',bad[:5],'tail',repr(s[-24:]))
              try:
                  b=base64.b64decode(s,validate=True)
                  print('  independent ok bytes',len(b),'sha',hashlib.sha256(b).hexdigest())
              except Exception as e:
                  print('  independent FAIL',repr(e))
          joined=''.join(''.join(p.read_text().split()) for p in sorted(Path('/tmp/p630').glob('*.txt')))
          print('JOIN len',len(joined),'mod4',len(joined)%4,'first_eq',joined.find('='),'eq_count',joined.count('='))
          try:
              b=base64.b64decode(joined,validate=True)
              print('JOIN valid bytes',len(b),'sha',hashlib.sha256(b).hexdigest())
              Path('/tmp/join.apk').write_bytes(b)
          except Exception as e: print('JOIN FAIL',repr(e))
          # Decode each independent segment if internal '=' suggests concatenated base64 streams.
          allb=bytearray()
          ok=True
          for p in sorted(Path('/tmp/p630').glob('*.txt')):
              s=''.join(p.read_text().split())
              try: allb += base64.b64decode(s,validate=False)
              except Exception as e: print('loose fail',p.name,e); ok=False
          if ok:
              print('LOOSE-EACH bytes',len(allb),'sha',hashlib.sha256(allb).hexdigest())
              Path('/tmp/each.apk').write_bytes(allb)
          PY
