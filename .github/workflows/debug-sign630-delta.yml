name: Recover staged 6.0.30 signed APK
on:
  push:
    branches: [family-630-game-fix]
    paths: ['.github/workflows/debug-sign630-delta.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'
      - name: Decode each staged v630 part independently
        run: |
          set -euo pipefail
          : > /tmp/OurFamily_6_0_30_recovered.apk
          for n in $(seq 0 9); do
            p=$(printf '%02d' "$n")
            curl --retry 4 --retry-delay 2 -fsSL \
              "https://raw.githubusercontent.com/servikan1981-bot/WorkTruckAPK/family-stable-6/updates/parts/v630_${p}.b64?recover=${GITHUB_RUN_ID}" \
              -o "/tmp/v630_${p}.b64"
            tr -d '\r\n' < "/tmp/v630_${p}.b64" | base64 -d >> /tmp/OurFamily_6_0_30_recovered.apk
          done
          echo "SIZE=$(stat -c%s /tmp/OurFamily_6_0_30_recovered.apk)"
          echo "SHA=$(sha256sum /tmp/OurFamily_6_0_30_recovered.apk | awk '{print $1}')"
          unzip -t /tmp/OurFamily_6_0_30_recovered.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/OurFamily_6_0_30_recovered.apk | tee /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/OurFamily_6_0_30_recovered.apk | tee /tmp/cert.txt
          grep -q "package: name='com.sergey.ourfamily' versionCode='6030' versionName='6.0.30'" /tmp/badging.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          echo "CERT=$CERT"
          test "$CERT" = '237977f5597cd292a76f597557a2131af530ceea08f089005396bd99dc993b83'
          unzip -p /tmp/OurFamily_6_0_30_recovered.apk assets/index.html | grep -q 'setInterval(pollInbox,350)'
          echo 'RECOVERED PRODUCTION APK VALID'
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamily_6_0_30_Recovered_Stable
          path: /tmp/OurFamily_6_0_30_recovered.apk
